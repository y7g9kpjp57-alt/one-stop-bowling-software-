dth:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px}.notice{padding:10px 12px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;margin-bottom:12px}.oknotice{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}.hidden{display:none!important}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:none;z-index:20;padding-bottom:env(safe-area-inset-bottom)}.bottom button{flex:1;border:0;background:#fff;padding:10px 4px;font-size:11px;color:#475569}.bottom button.active{color:var(--blue);font-weight:800}.bottom b{display:block;font-size:18px;margin-bottom:2px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}.modalbox{background:#fff;border-radius:16px;padding:18px;width:min(390px,100%)}.modalbox input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:22px;text-align:center;letter-spacing:5px;margin:8px 0 12px}.bracket{display:grid;grid-template-columns:repeat(3,minmax(210px,1fr));gap:16px;overflow:auto}.round{min-width:210px}.match{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff;overflow:hidden}.match div{padding:8px 10px;border-bottom:1px solid var(--line)}.match div:last-child{border-bottom:0}.qual{font-size:12px;color:var(--muted)}

@media print{header,.toolbar,.tabs,.bottom,.noPrint,#syncNotice{display:none!important}.wrap{max-width:none;padding:0}.scorecards-grid{display:grid!important;grid-template-columns:repeat(4,1fr);gap:4mm}.scorecard{border-radius:0;min-height:0;height:278mm;padding:3mm}.scorecard-title{font-size:12px}.scorecard-info{font-size:8px}.player-lines>div{font-size:8px;min-height:17px}.score-table th,.score-table td{font-size:7px;height:auto;min-height:0}.score-table tr{height:7.2mm}.scorecard-total{font-size:9px}.scorecard-foot{font-size:6px}@page{size:A3 landscape;margin:6mm}}

.tv-mode{background:#020617;color:#f8fafc;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.tv-wrap{min-height:100vh;padding:32px 42px}.tv-head{display:flex;justify-content:space-between;align-items:end;border-bottom:3px solid #38bdf8;padding-bottom:16px;margin-bottom:24px}.tv-head h1{font-size:42px;margin:0}.tv-head .sub{font-size:20px;color:#bae6fd}.tv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.tv-card{background:#0f172a;border:1px solid #334155;border-radius:18px;padding:22px}.tv-card h2{font-size:30px;margin:0 0 14px}.tv-table{width:100%;border-collapse:collapse;min-width:0;background:transparent}.tv-table th,.tv-table td{border-bottom:1px solid #334155;padding:11px 10px;font-size:22px;color:#f8fafc}.tv-table th{background:#1e293b;font-size:16px;color:#bae6fd}.tv-score{font-size:34px;font-weight:900}.tv-muted{color:#94a3b8}.tv-footer{position:fixed;left:42px;right:42px;bottom:18px;display:flex;justify-content:space-between;color:#94a3b8;font-size:15px}.tv-big-list{display:grid;gap:12px}.tv-match{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;background:#0f172a;border:1px solid #334155;border-radius:16px;padding:18px 20px;font-size:28px}.tv-match .right{text-align:right}.tv-match .score{font-size:36px;font-weight:900;color:#7dd3fc}.tv-empty{text-align:center;font-size:30px;color:#94a3b8;padding:70px 20px}.tv-controls{display:flex;gap:10px;align-items:center}.tv-controls button{border:1px solid #475569;background:#0f172a;color:#fff;padding:9px 13px;border-radius:10px;font-size:14px}@media(max-width:900px){.tv-wrap{padding:22px}.tv-head h1{font-size:30px}.tv-grid{grid-template-columns:1fr}.tv-table th,.tv-table td{font-size:18px}.tv-match{font-size:22px}.tv-footer{left:22px;right:22px}}

<body>
<header class="top">
  <div class="brand"><div class="ball"></div><div><h1>One Stop Bowling Software</h1><small id="subtitle">Live tournament management</small></div></div>
  <div class="rolebar"><button data-role="public" class="active">Public View</button><button data-role="scorer">Scorer</button><button data-role="admin">Admin</button></div>
</header>
<main class="wrap">
  <div class="notice" id="syncNotice">Offline mode: tournaments and scores are saved on this device. Use Backup regularly to save a copy you can restore on another device.</div>
  <div class="toolbar">
    <select id="competitionSelect" class="grow"></select>
    <button class="btn secondary" id="exportBtn">Backup</button>
    <label class="btn secondary" style="cursor:pointer">Restore<input id="importFile" type="file" accept="application/json" hidden></label>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <section id="screen"></section>
</main>
<nav class="bottom" id="bottomNav"></nav>
<div class="modal hidden" id="pinModal"><div class="modalbox"><h3 id="pinTitle">Enter PIN</h3><p class="muted" id="pinText"></p><input id="pinInput" inputmode="numeric" maxlength="8" type="password"><div style="display:flex;gap:8px"><button class="btn secondary" style="flex:1" id="pinCancel">Cancel</button><button class="btn primary" style="flex:1" id="pinGo">Unlock</button></div><p id="pinError" style="color:#b91c1c"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://oexgvfbgxtcxhnmscuob.supabase.co';
const SUPABASE_KEY='sb_publishable_Q9GQwbevHNobyIiQ5XC76w_PvJZSJuY';
const LIVE_STATE_ID='demo';
let cloud=null,cloudReady=false,cloudApplying=false,cloudChannel=null;
const APPKEY='bowlsTournamentProOfflineV2';
const defaultComp=()=>({
 id:'comp-'+Date.now(),title:'Bowls Competition',created:new Date().toISOString(),
 settings:{clubName:'Your Bowls Club',tournamentType:'standard',scoringMode:'final',aggregateSideA:'District A',aggregateSideB:'District B',aggregateRinks:6,gameType:'rinks',drawMethod:'auto',manualGroups:4,teamCount:16,groupSize:4,rinks:4,ends:12,start:'09:00',minutes:80,knockoutMinutes:80,targetFinish:'21:00',eventFormat:'same_day',day1TargetFinish:'21:00',day2Start:'09:00',winPts:2,drawPts:1,qualify:'winner_best_runner',bestRunners:4,optimise:'balanced'},
 pins:{admin:'0001',scorer:'0001'},teams:Array.from({length:16},(_,i)=>({id:'t'+(i+1),name:'Team '+(i+1),group:'',players:{}})),fixtures:[],knockout:[],drawSeed:1
});
let db=loadDB();let role='public', unlocked={public:true,scorer:false,admin:false}, tab='dashboard';
function loadDB(){try{let x=JSON.parse(localStorage.getItem(APPKEY));if(x&&x.competitions?.length)return x}catch(e){}return {competitions:[defaultComp()],active:null}}
function saveDB(){localStorage.setItem(APPKEY,JSON.stringify(db));if(cloudReady&&!cloudApplying)pushCloudState();}
async function pushCloudState(){
 try{
  let {error}=await cloud.from('bowls_live_state').upsert({id:LIVE_STATE_ID,state:db,updated_at:new Date().toISOString()},{onConflict:'id'});
  if(error)throw error;setSyncNotice('Live sync connected • changes shared with all devices',true);
 }catch(e){console.error('Cloud save failed',e);setSyncNotice('Live sync temporarily unavailable • changes are still saved on this device',false)}
}
function setSyncNotice(msg,ok){let el=document.getElementById('syncNotice');if(!el)return;el.textContent=msg;el.classList.toggle('oknotice',!!ok)}
async function initCloudSync(){
 try{
  if(!window.supabase?.createClient)throw new Error('Supabase library did not load');
  cloud=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  setSyncNotice('Connecting live sync…',false);
  let {data,error}=await cloud.from('bowls_live_state').select('state,updated_at').eq('id',LIVE_STATE_ID).maybeSingle();
  if(error)throw error;
  if(data?.state?.competitions?.length){cloudApplying=true;db=data.state;localStorage.setItem(APPKEY,JSON.stringify(db));cloudApplying=false;render()}
  else {cloudReady=true;await pushCloudState()}
  cloudReady=true;setSyncNotice('Live sync connected • changes shared with all devices',true);
  cloudChannel=cloud.channel('bowls-live-demo').on('postgres_changes',{event:'UPDATE',schema:'public',table:'bowls_live_state',filter:`id=eq.${LIVE_STATE_ID}`},payload=>{
   let next=payload.new?.state;if(!next?.competitions?.length)return;
   cloudApplying=true;db=next;localStorage.setItem(APPKEY,JSON.stringify(db));cloudApplying=false;render();setSyncNotice('Live sync connected • latest changes received',true);
  }).subscribe(status=>{if(status==='SUBSCRIBED')setSyncNotice('Live sync connected • changes shared with all devices',true)});
 }catch(e){console.error('Cloud sync failed',e);cloudReady=false;setSyncNotice('Offline mode • live sync could not connect, but this device will keep saving locally',false)}
}

function comp(){if(!db.active)db.active=db.competitions[0].id;return db.competitions.find(c=>c.id===db.active)||db.competitions[0]}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function tabsFor(){if(role==='public')return [['dashboard','Home','⌂'],['tables','Tables','▤'],['fixtures','Fixtures','▦'],['knockout','Finals','🏆']];if(role==='scorer')return [['quick','Quick Score','⚡'],['fixtures','Fixtures','▦'],['tables','Tables','▤']];return [['dashboard','Dashboard','⌂'],['builder','Setup','⚙'],['teams','Teams','👥'],['draw','Draw','🎲'],['schedule','Rinks','▦'],['quick','Scores','⚡'],['tables','Tables','▤'],['scorecards','Scorecards','🖨'],['knockout','Knockout','🏆'],['admin','Admin','🔐']]}
function renderNav(){let tabs=tabsFor(); if(!tabs.some(x=>x[0]===tab))tab=tabs[0][0];document.getElementById('tabs').innerHTML=tabs.map(x=>`<button class="${tab===x[0]?'active':''}" data-tab="${x[0]}">${x[1]}</button>`).join('');document.getElementById('bottomNav').innerHTML=tabs.slice(0,5).map(x=>`<button class="${tab===x[0]?'active':''}" data-tab="${x[0]}"><b>${x[2]}</b>${x[1]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function renderSelect(){let s=document.getElementById('competitionSelect');s.innerHTML=db.competitions.map(c=>`<option value="${c.id}" ${c.id===comp().id?'selected':''}>${esc(c.title)}</option>`).join('');s.onchange=()=>{db.active=s.value;saveDB();render()}}
function render(){renderSelect();renderNav();document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role));document.getElementById('subtitle').textContent=comp().title+' • '+role[0].toUpperCase()+role.slice(1);let s=document.getElementById('screen');({dashboard:renderDashboard,builder:renderBuilder,teams:renderTeams,draw:renderDraw,schedule:renderSchedule,fixtures:renderFixtures,quick:renderQuick,tables:renderTables,scorecards:renderScorecards,knockout:renderKnockout,admin:renderAdmin}[tab]||renderDashboard)(s)}
function completed(f){return Number.isFinite(+f.scoreA)&&Number.isFinite(+f.scoreB)&&f.scoreA!==''&&f.scoreB!==''}
function isAggregate(c=comp()){return (c.settings.tournamentType||'standard')==='aggregate'}
function ensureAggregate(c=comp()){let x=c.settings,n=Math.max(1,+x.aggregateRinks||6);c.aggregateScores=c.aggregateScores||[];while(c.aggregateScores.length<n)c.aggregateScores.push({rink:c.aggregateScores.length+1,scoreA:'',scoreB:'',skipA:'',skipB:''});c.aggregateScores=c.aggregateScores.slice(0,n);c.aggregateScores.forEach((r,i)=>{r.rink=i+1;r.skipA=r.skipA||'';r.skipB=r.skipB||''});return c.aggregateScores}
function aggregateTotals(c=comp()){let rows=ensureAggregate(c),a=0,b=0,complete=0;rows.forEach(r=>{let s=currentScore(r);if(completed(r))complete++;a+=s.a;b+=s.b});return {a,b,complete,total:rows.length}}
function standings(c=comp()){
 let out={};c.teams.forEach(t=>out[t.group]??=[]);c.teams.forEach(t=>{if(t.group)out[t.group].push({id:t.id,name:t.name,p:0,w:0,d:0,l:0,sf:0,sa:0,sd:0,pts:0})});
 let map={};Object.values(out).flat().forEach(r=>map[r.id]=r);
 c.fixtures.filter(completed).forEach(f=>{let a=map[f.a],b=map[f.b];if(!a||!b)return;let sa=+f.scoreA,sb=+f.scoreB;a.p++;b.p++;a.sf+=sa;a.sa+=sb;b.sf+=sb;b.sa+=sa;if(sa>sb){a.w++;b.l++;a.pts+=c.settings.winPts}else if(sb>sa){b.w++;a.l++;b.pts+=c.settings.winPts}else if(sa===0&&sb===0){}else{a.d++;b.d++;a.pts+=c.settings.drawPts;b.pts+=c.settings.drawPts}});
 Object.values(out).forEach(rows=>rows.forEach(r=>r.sd=r.sf-r.sa));Object.values(out).forEach(rows=>rows.sort((a,b)=>b.pts-a.pts||b.sd-a.sd||b.sf-a.sf||a.name.localeCompare(b.name)));return out
}

function liveEntries(obj){obj.liveEnds=obj.liveEnds||[];return obj.liveEnds}
function liveScore(obj){let a=0,b=0,count=0;liveEntries(obj).forEach(e=>{if(e&&(e.a!==''||e.b!=='')){a+=Math.max(0,+e.a||0);b+=Math.max(0,+e.b||0);count++}});return {a,b,count}}
function scoringLabel(c=comp()){return (c.settings.scoringMode||'final')==='live_optional'?'Live end-by-end optional':'Final score only'}
function currentScore(obj){if(completed(obj))return {a:+obj.scoreA,b:+obj.scoreB,final:true,ends:liveScore(obj).count};let l=liveScore(obj);return {a:l.a,b:l.b,final:false,ends:l.count}}
function attachBowlsEndRules(root=document,onChange=()=>{}){root.querySelectorAll('[data-live-a],[data-live-b]').forEach(inp=>{inp.addEventListener('input',()=>{let key=inp.getAttribute('data-live-a')||inp.getAttribute('data-live-b'),isA=inp.hasAttribute('data-live-a'),other=root.querySelector(`[${isA?'data-live-b':'data-live-a'}=\"${key}\"]`);let v=inp.value===''?null:Math.max(0,+inp.value||0);if(v!==null&&v>0&&other)other.value='0';onChange()})})}
function renderBuilder(s){
 let c=comp(),x=c.settings;x.scoringMode=x.scoringMode||'final';x.tournamentType=x.tournamentType||'standard';
 let agg=x.tournamentType==='aggregate';
 s.innerHTML=`<div class="card"><h2>Tournament Setup</h2><p class="muted">Live scoring is optional. You can always skip end-by-end updates and enter the final score only.</p>
 <div class="formgrid">
  <div class="field"><label>Competition name</label><input id="bTitle" value="${esc(c.title)}"></div>
  <div class="field"><label>Club / organiser</label><input id="bClub" value="${esc(x.clubName||'')}"></div>
  <div class="field"><label>Tournament type</label><select id="bType"><option value="standard" ${!agg?'selected':''}>Standard tournament</option><option value="aggregate" ${agg?'selected':''}>Team / District Match – Aggregate</option></select></div>
  <div class="field"><label>Scoring mode</label><select id="bScoring"><option value="final" ${x.scoringMode==='final'?'selected':''}>Final Score Only</option><option value="live_optional" ${x.scoringMode==='live_optional'?'selected':''}>Live End-by-End + Final Score</option></select></div>
  <div class="field"><label>Game format</label><select id="bGame"><option value="singles" ${x.gameType==='singles'?'selected':''}>Singles</option><option value="pairs" ${x.gameType==='pairs'?'selected':''}>Pairs</option><option value="triples" ${x.gameType==='triples'?'selected':''}>Triples</option><option value="rinks" ${x.gameType==='rinks'?'selected':''}>Rinks / Fours</option></select></div>
  <div class="field"><label>Ends</label><input id="bEnds" type="number" min="1" max="40" value="${x.ends||12}"></div>
 </div>
 <div id="aggSetup" class="${agg?'':'hidden'}" style="margin-top:12px"><div class="formgrid">

function pickFullestSession(pending,rinks,prevTeams=new Set()){
 // Primary goal: fill as many rinks as possible. Secondary goal: where equally full
 // schedules exist, prefer teams that did NOT play in the previous session.
 let best=[],bestBack=Infinity;let tries=Math.min(900,150+pending.length*10);
 for(let t=0;t<tries;t++){
  let used=new Set(),slot=[];
  let degree={};pending.forEach(z=>{degree[z.a.id]=(degree[z.a.id]||0)+1;degree[z.b.id]=(degree[z.b.id]||0)+1});
  let order=[...pending].sort((u,v)=>{
   let ub=(prevTeams.has(u.a.id)?1:0)+(prevTeams.has(u.b.id)?1:0),vb=(prevTeams.has(v.a.id)?1:0)+(prevTeams.has(v.b.id)?1:0);
   let du=degree[u.a.id]+degree[u.b.id],dv=degree[v.a.id]+degree[v.b.id];
   if(t===0)return ub-vb||dv-du||u.round-v.round;
   return (ub-vb)*4+(dv-du)*.12+(u.round-v.round)*.02+(Math.random()-.5)*3;
  });
  for(let z of order){if(slot.length>=rinks)break;if(!used.has(z.a.id)&&!used.has(z.b.id)){slot.push(z);used.add(z.a.id);used.add(z.b.id)}}
  let back=slot.reduce((n,z)=>n+(prevTeams.has(z.a.id)?1:0)+(prevTeams.has(z.b.id)?1:0),0);
  if(slot.length>best.length||(slot.length===best.length&&back<bestBack)){best=slot;bestBack=back}
  if(best.length===rinks&&bestBack===0)break;
 }
 return best.length?best:[pending[0]];
}
function sessionTeams(slot){return new Set(slot.flatMap(z=>[z.a.id,z.b.id]))}
function sessionBalanceScore(slots,rinks){

function rebalanceSessions(slots,rinks){

 while(guard++<250){
  let base=sessionBalanceScore(work,rinks),best=null,bestScore=base;
  for(let si=0;si<work.length;si++){
   for(let gi=0;gi<work[si].length;gi++){
    let game=work[si][gi],ids=new Set([game.a.id,game.b.id]);
    for(let di=0;di<work.length;di++){
     if(di===si||work[di].length>=rinks)continue;

     let trial=work.map(x=>[...x]);trial[si].splice(gi,1);trial[di].push(game);trial=trial.filter(x=>x.length);
     let score=sessionBalanceScore(trial,rinks);
     if(score<bestScore){best={si,gi,di};bestScore=score}
    }
   }
  }

function scheduleGames(all,rinks){

  };refreshAggregatePreview();return
 }
 let fs=c.fixtures;if(!fs.length){s.innerHTML='<div class="card"><h2>Quick Score</h2><p>No fixtures generated yet.</p></div>';return}
 let session=Math.min(...fs.filter(f=>!completed(f)).map(f=>f.session).concat([Math.max(...fs.map(f=>f.session))]));
 s.innerHTML=`<div class="card"><h2>Quick Score</h2><p class="muted">${live?'Live end-by-end is optional. Update ends when convenient, or simply enter the final score.':'Enter the final result for each game.'}</p><div class="toolbar"><select id="sessionPick">${[...new Set(fs.map(f=>f.session))].map(n=>`<option ${n===session?'selected':''} value="${n}">Session ${n} • ${fs.find(f=>f.session===n).start}</option>`).join('')}</select></div><div id="scoreList"></div></div>`;
 let draw=()=>{let n=+document.getElementById('sessionPick').value;document.getElementById('scoreList').innerHTML=fs.filter(f=>f.session===n).map(f=>{let ls=liveScore(f);return `<div class="card" style="box-shadow:none"><div><b>${esc(fixtureTeamName(f,'a',c))}</b> v <b>${esc(fixtureTeamName(f,'b',c))}</b><div class="meta">Group ${f.group} • Rink ${f.rink} • Game ${f.game}</div></div>${live?`<details style="margin-top:10px"><summary><b>Live ends</b> ${ls.count?`— ${ls.a}–${ls.b} after ${ls.count}`:''}</summary><div class="tablewrap" style="margin-top:8px"><table style="min-width:420px"><thead><tr><th>End</th><th>${esc(fixtureTeamName(f,'a',c))}</th><th>${esc(fixtureTeamName(f,'b',c))}</th></tr></thead><tbody>${Array.from({length:x.ends||12},(_,i)=>{let e=liveEntries(f)[i]||{a:'',b:''};return `<tr><td>${i+1}</td><td><input style="width:70px" inputmode="numeric" min="0" data-live-a="${f.id}-${i}" value="${e.a??''}"></td><td><input style="width:70px" inputmode="numeric" min="0" data-live-b="${f.id}-${i}" value="${e.b??''}"></td></tr>`}).join('')}</tbody></table></div></details>`:''}<div class="scoreline"><div><b>${esc(fixtureTeamName(f,'a',c))}</b><div class="meta">Final score</div></div><input inputmode="numeric" min="0" data-sa="${f.id}" value="${f.scoreA}"><b>–</b><input inputmode="numeric" min="0" data-sb="${f.id}" value="${f.scoreB}"><div class="away"><b>${esc(fixtureTeamName(f,'b',c))}</b><div class="meta">Final score</div></div></div></div>`}).join('')+`<button class="btn primary" style="width:100%;margin-top:12px" id="saveScores">Save Scores</button>`;
  attachBowlsEndRules(document.getElementById('scoreList'));
  document.getElementById('saveScores').onclick=()=>{fs.filter(f=>f.session===n).forEach(f=>{let a=document.querySelector(`[data-sa="${f.id}"]`),b=document.querySelector(`[data-sb="${f.id}"]`);f.scoreA=a.value===''?'':Math.max(0,+a.value);f.scoreB=b.value===''?'':Math.max(0,+b.value);if(live){f.liveEnds=Array.from({length:x.ends||12},(_,i)=>{let la=document.querySelector(`[data-live-a="${f.id}-${i}"]`),lb=document.querySelector(`[data-live-b="${f.id}-${i}"]`);return {a:la?.value===''?'':Math.max(0,+la.value||0),b:lb?.value===''?'':Math.max(0,+lb.value||0)}})}});saveDB();render()}
 };
 document.getElementById('sessionPick').onchange=draw;draw()
}
function renderTables(s){if(isAggregate()){let c=comp(),x=c.settings,t=aggregateTotals(c);s.innerHTML=`<div class="card"><h2>Overall Team Score</h2><div style="display:grid;grid-template-columns:1fr auto 1fr;gap:16px;text-align:center;align-items:center;padding:24px 0"><div><h3>${esc(x.aggregateSideA||'Side A')}</h3><b style="font-size:48px">${t.a}</b></div><div style="font-size:28px;font-weight:900">–</div><div><h3>${esc(x.aggregateSideB||'Side B')}</h3><b style="font-size:48px">${t.b}</b></div></div><p class="muted" style="text-align:center">${t.complete} of ${t.total} rinks complete</p></div>`;return}let st=standings();let keys=Object.keys(st).sort();if(!keys.length){s.innerHTML='<div class="card"><h2>Group Tables</h2><p>No group draw yet.</p></div>';return}s.innerHTML=`<div class="groupgrid">${keys.map(g=>`<div class="groupbox"><h3>Group ${g}</h3><div class="tablewrap"><table style="min-width:520px"><thead><tr><th>Pos</th><th>Team</th><th>P</th><th>SF</th><th>SA</th><th>SD</th><th>Pts</th></tr></thead><tbody>${st[g].map((r,i)=>`<tr><td><b>${i+1}</b></td><td>${esc(r.name)}</td><td>${r.p}</td><td>${r.sf}</td><td>${r.sa}</td><td>${r.sd>0?'+':''}${r.sd}</td><td><b>${r.pts}</b></td></tr>`).join('')}</tbody></table></div></div>`).join('')}</div>`}
function qualifiers(){let c=comp(),st=standings(c),out=[];let rows=Object.entries(st);if(c.settings.qualify==='winners')rows.forEach(([g,r])=>r[0]&&out.push({...r[0],group:g,pos:1}));else if(c.settings.qualify==='top2')rows.forEach(([g,r])=>r.slice(0,2).forEach((x,i)=>out.push({...x,group:g,pos:i+1})));else{rows.forEach(([g,r])=>r[0]&&out.push({...r[0],group:g,pos:1}));let runners=rows.map(([g,r])=>r[1]&&({...r[1],group:g,pos:2})).filter(Boolean).sort((a,b)=>b.pts-a.pts||b.sd-a.sd||b.sf-a.sf);out.push(...runners.slice(0,c.settings.bestRunners))}return out}
function buildKnockoutFirstRound(q){
 let size=1;while(size<q.length)size*=2;let byeCount=size-q.length,ranked=q.map((x,i)=>({...x,_rank:i})),winners=ranked.filter(x=>x.pos===1),others=ranked.filter(x=>x.pos!==1),matches=[],used=new Set();
 // Give unavoidable byes to the highest-ranked group winners first.
 winners.slice(0,byeCount).forEach(w=>{matches.push({a:w.id,b:null,scoreA:'',scoreB:'',sameGroupRematch:false,groupA:w.group,groupB:null});used.add(w.id)});
 let remainingWinners=winners.filter(w=>!used.has(w.id));
 // Prefer winner v qualifier from another group.
 remainingWinners.forEach(w=>{let pool=others.filter(o=>!used.has(o.id)),opp=pool.find(o=>o.group!==w.group)||pool[0];if(opp){matches.push({a:w.id,b:opp.id,scoreA:'',scoreB:'',sameGroupRematch:opp.group===w.group,groupA:w.group,groupB:opp.group});used.add(w.id);used.add(opp.id)}});
 let left=ranked.filter(x=>!used.has(x.id));
 // Pair remaining qualifiers, again avoiding same-group meetings wherever possible.
 while(left.length>1){let a=left.shift(),idx=left.findIndex(b=>b.group!==a.group);if(idx<0)idx=0;let b=left.splice(idx,1)[0];matches.push({a:a.id,b:b.id,scoreA:'',scoreB:'',sameGroupRematch:a.group===b.group,groupA:a.group,groupB:b.group});used.add(a.id);used.add(b.id)}
 if(left.length){let a=left.shift();matches.push({a:a.id,b:null,scoreA:'',scoreB:'',sameGroupRematch:false,groupA:a.group,groupB:null})}
 while(matches.length<size/2)matches.push({a:null,b:null,scoreA:'',scoreB:'',sameGroupRematch:false,groupA:null,groupB:null});
 return matches;
}
function generateKnockout(){let c=comp(),q=qualifiers();if(q.length<2){alert('Not enough qualifiers yet.');return}let matches=buildKnockoutFirstRound(q);c.knockout=[matches];saveDB();render()}
function renderKnockout(s){let c=comp(),q=qualifiers(),first=c.knockout[0]||[],rematches=first.filter(m=>m.a&&m.b&&m.sameGroupRematch).length;s.innerHTML=`<div class="card"><h2>Knockout</h2><p class="muted">Qualifiers are ranked by points, shot difference and shots for. The first knockout round keeps group winners apart from qualifiers from the same group wherever possible.</p><div>${q.map((x,i)=>`<span class="pill wait" style="margin:3px">${i+1}. ${esc(x.name)} <span class="qual">(${x.group}${x.pos})</span></span>`).join('')||'No qualifiers yet.'}</div>${role==='admin'?`<button class="btn primary" id="genKO" style="margin-top:12px">Generate Knockout</button>`:''}${c.knockout.length?`<div class="${rematches?'notice':'oknotice notice'}" style="margin-top:12px"><b>First-round group protection:</b> ${rematches?`${rematches} same-group rematch${rematches===1?'':'es'} could not be avoided with this qualifier combination.`:'No same-group rematches in the first knockout round.'}</div>`:''}</div>${c.knockout.length?`<div class="card"><div class="bracket">${c.knockout.map((round,ri)=>`<div class="round"><h3>${ri===c.knockout.length-1&&round.length===1?'Final':ri===0?'First Round':'Round '+(ri+1)}</h3>${round.map((m,mi)=>`<div class="match"><div>${esc(m.a?teamName(m.a):'BYE')}</div><div>${esc(m.b?teamName(m.b):'BYE')}</div>${ri===0&&m.sameGroupRematch?'<div class="qual" style="color:#b45309;font-weight:700">⚠ Same-group rematch unavoidable</div>':''}</div>`).join('')}</div>`).join('')}</div></div>`:''}`;if(role==='admin'&&document.getElementById('genKO'))document.getElementById('genKO').onclick=generateKnockout}
function renderAdmin(s){let c=comp();s.innerHTML=`<div class="card"><h2>Access & Competition Admin</h2><div class="formgrid"><div class="field"><label>Admin PIN</label><input id="adminPin" type="password" value="${esc(c.pins.admin)}"></div><div class="field"><label>Scorer PIN</label><input id="scorerPin" type="password" value="${esc(c.pins.scorer)}"></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" id="savePins">Save PINs</button><button class="btn secondary" id="newComp">New Competition</button><button class="btn danger" id="resetComp">Reset Current Competition</button></div></div><div class="card"><h3>Easy-link plan</h3><p><b>Public:</b> <span class="muted">/ ?view=public</span><br><b>Scorer:</b> <span class="muted">/ ?view=scorer</span><br><b>Admin:</b> <span class="muted">/ ?view=admin</span></p><p class="muted">Once hosted, these can be pointed to three TinyURLs and QR codes.</p></div>`;document.getElementById('savePins').onclick=()=>{c.pins.admin=document.getElementById('adminPin').value||'0001';c.pins.scorer=document.getElementById('scorerPin').value||'0001';saveDB();alert('PINs saved')};document.getElementById('newComp').onclick=()=>{let n=defaultComp();n.title='New Competition';db.competitions.push(n);db.active=n.id;saveDB();tab='builder';render()};document.getElementById('resetComp').onclick=()=>{if(confirm('Reset this competition? Scores, draw and fixtures will be cleared.')){c.fixtures=[];c.knockout=[];c.teams.forEach((t,i)=>{t.group='';t.name='Team '+(i+1);t.players={}});saveDB();render()}}}
function askPin(nextRole){let c=comp();document.getElementById('pinTitle').textContent=nextRole==='admin'?'Admin PIN':'Scorer PIN';document.getElementById('pinText').textContent='Enter the PIN for '+c.title;document.getElementById('pinInput').value='';document.getElementById('pinError').textContent='';document.getElementById('pinModal').classList.remove('hidden');document.getElementById('pinInput').focus();document.getElementById('pinGo').onclick=()=>{if(document.getElementById('pinInput').value===c.pins[nextRole]){unlocked[nextRole]=true;role=nextRole;document.getElementById('pinModal').classList.add('hidden');tab=nextRole==='scorer'?'quick':'dashboard';setQueryRole(nextRole);render()}else document.getElementById('pinError').textContent='Incorrect PIN'}}
function setQueryRole(r){try{let u=new URL(location.href);u.searchParams.set('view',r);history.replaceState({},'',u)}catch(e){}}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{let r=b.dataset.role;if(r==='public'||unlocked[r]){role=r;tab='dashboard';setQueryRole(r);render()}else askPin(r)});document.getElementById('pinCancel').onclick=()=>document.getElementById('pinModal').classList.add('hidden');document.getElementById('pinInput').onkeydown=e=>{if(e.key==='Enter')document.getElementById('pinGo').click()};
document.getElementById('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bowls-tournament-backup.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.competitions)throw 0;db=x;saveDB();render()}catch{alert('That backup file could not be read.')}};r.readAsText(f)};
function tvCurrentGames(c){let fs=c.fixtures||[],pending=fs.filter(f=>!completed(f));if(!fs.length)return[];let currentSession=pending.length?Math.min(...pending.map(f=>f.session)):Math.max(...fs.map(f=>f.session));return fs.filter(f=>f.session===currentSession)}
function tvUpcoming(c){let fs=(c.fixtures||[]).filter(f=>!completed(f));if(!fs.length)return[];let sessions=[...new Set(fs.map(f=>f.session))].sort((a,b)=>a-b);let n=sessions[0];return fs.filter(f=>f.session===n).slice(0,12)}
function tvTableHTML(c){let st=standings(c),keys=Object.keys(st).sort();if(!keys.length)return '<div class="tv-empty">Group tables will appear after the draw.</div>';return `<div class="tv-grid">${keys.map(g=>`<div class="tv-card"><h2>Group ${g}</h2><table class="tv-table"><thead><tr><th>Pos</th><th>Team</th><th>P</th><th>SD</th><th>Pts</th></tr></thead><tbody>${st[g].map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.name)}</b></td><td>${r.p}</td><td>${r.sd>0?'+':''}${r.sd}</td><td><b>${r.pts}</b></td></tr>`).join('')}</tbody></table></div>`).join('')}</div>`}
function tvMatchesHTML(rows,title,empty){if(!rows.length)return `<div class="tv-empty">${empty}</div>`;return `<div class="tv-card"><h2>${title}</h2><div class="tv-big-list">${rows.map(f=>`<div class="tv-match"><div><b>${esc(fixtureTeamName(f,'a'))}</b><div class="tv-muted" style="font-size:16px">Group ${esc(f.group)} • Rink ${f.rink}</div></div><div class="score">${completed(f)?`${f.scoreA} – ${f.scoreB}`:'vs'}</div><div class="right"><b>${esc(fixtureTeamName(f,'b'))}</b><div class="tv-muted" style="font-size:16px">${f.start} • Game ${f.game}</div></div></div>`).join('')}</div></div>`}
function tvFinalsHTML(c){if(!c.knockout?.length)return '<div class="tv-empty">Knockout / finals will appear here when generated.</div>';return `<div class="tv-grid">${c.knockout.map((round,ri)=>`<div class="tv-card"><h2>${ri===c.knockout.length-1&&round.length===1?'Final':ri===0?'First Round':'Round '+(ri+1)}</h2>${round.map(m=>`<div class="tv-match" style="grid-template-columns:1fr auto 1fr;margin-bottom:12px"><div><b>${esc(m.a?teamName(m.a,c):'BYE')}</b></div><div class="score">vs</div><div class="right"><b>${esc(m.b?teamName(m.b,c):'BYE')}</b></div></div>`).join('')}</div>`).join('')}</div>`}
let tvPage=0,tvTimer=null,tvPaused=false;
function renderTv(){let c=comp(),pages=['Live / Current Games','Group Tables','Upcoming Fixtures','Finals'],title=pages[tvPage%pages.length],body='';if(tvPage%4===0)body=tvMatchesHTML(tvCurrentGames(c),'Current Session','No games have been scheduled yet.');if(tvPage%4===1)body=tvTableHTML(c);if(tvPage%4===2)body=tvMatchesHTML(tvUpcoming(c),'Upcoming Fixtures','No upcoming fixtures.');if(tvPage%4===3)body=tvFinalsHTML(c);document.body.className='tv-mode';document.body.innerHTML=`<div class="tv-wrap"><div class="tv-head"><div><h1>${esc(c.title)}</h1><div class="sub">${esc(c.settings.clubName||'')} • ${title}</div></div><div class="tv-controls"><button id="tvPrev">◀</button><button id="tvPause">${tvPaused?'Resume':'Pause'}</button><button id="tvNext">▶</button><button id="tvFull">Full Screen</button></div></div>${body}<div class="tv-footer"><span>One Stop Bowling Software • TV Display</span><span>Updates automatically • Screen ${tvPage%4+1}/4</span></div></div>`;document.getElementById('tvPrev').onclick=()=>{tvPage=(tvPage+3)%4;renderTv()};document.getElementById('tvNext').onclick=()=>{tvPage=(tvPage+1)%4;renderTv()};document.getElementById('tvPause').onclick=()=>{tvPaused=!tvPaused;renderTv()};document.getElementById('tvFull').onclick=()=>document.documentElement.requestFullscreen?.();}
function startTv(){renderTv();tvTimer=setInterval(()=>{try{db=loadDB()}catch(e){}if(!tvPaused){tvPage=(tvPage+1)%4;renderTv()}else renderTv()},10000);window.addEventListener('storage',()=>{db=loadDB();renderTv()});}
let params=new URLSearchParams(location.search);if(params.get('tv')==='1'){startTv();initCloudSync()}else{let initial=params.get('view');if(initial==='scorer'||initial==='admin')setTimeout(()=>askPin(initial),100);render();initCloudSync();}
