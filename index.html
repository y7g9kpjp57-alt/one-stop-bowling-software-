.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:650px;background:#fff}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{background:#f1f5f9;font-size:12px;text-transform:uppercase;letter-spacing:.03em}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.pill.done{background:#dcfce7;color:#166534}.pill.wait{background:#fef3c7;color:#92400e}.scoreline{display:grid;grid-template-columns:1fr 58px 22px 58px 1fr;gap:7px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.scoreline:last-child{border-bottom:0}.scoreline input{width:58px;text-align:center;padding:10px 5px;border:1px solid #cbd5e1;border-radius:9px;font-size:18px;font-weight:800}.scoreline .away{text-align:right}.meta{font-size:12px;color:var(--muted);margin-top:3px}.groupgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.groupbox h3{background:var(--nav);color:#fff;padding:9px 11px;border-radius:10px 10px 0 0;margin:0}.groupbox .tablewrap{border-radius:0 0 10px 10px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:700}.field input,.field select{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px;background:#fff}.teamrow{display:flex;gap:8px;margin-bottom:7px}.teamrow span{width:34px;color:var(--muted);padding-top:10px}.teamrow input{flex:1;border:1px solid #cbd5e1;border-radius:9px;padding:9px}.teamcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}.teamhead{display:grid;grid-template-columns:36px 1fr 44px;gap:8px;align-items:center}.teamplayers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.teamplayers label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px}.teamplayers input{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px}.notice{padding:10px 12px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;margin-bottom:12px}.oknotice{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}.hidden{display:none!important}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:none;z-index:20;padding-bottom:env(safe-area-inset-bottom)}.bottom button{flex:1;border:0;background:#fff;padding:10px 4px;font-size:11px;color:#475569}.bottom button.active{color:var(--blue);font-weight:800}.bottom b{display:block;font-size:18px;margin-bottom:2px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}.modalbox{background:#fff;border-radius:16px;padding:18px;width:min(390px,100%)}.modalbox input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:22px;text-align:center;letter-spacing:5px;margin:8px 0 12px}.bracket{display:flex;gap:42px;overflow:auto;padding:8px 14px 18px 4px;align-items:stretch}.round{min-width:230px;display:flex;flex-direction:column;justify-content:space-around;position:relative}.round h3{position:sticky;top:0;background:var(--bg);z-index:2;margin:0 0 8px;padding:5px 0}.match{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:#fff;overflow:visible;position:relative}.match:after{content:'';position:absolute;right:-22px;top:50%;width:22px;border-top:2px solid #94a3b8}.round:last-child .match:after{display:none}.match div{padding:8px 10px;border-bottom:1px solid var(--line)}.match div:last-child{border-bottom:0}.qual{font-size:12px;color:var(--muted)}.ko-scorebox{display:grid;grid-template-columns:1fr 64px 20px 64px 1fr;gap:7px;align-items:center;margin-top:10px}.ko-scorebox input{width:64px;text-align:center;font-size:19px;font-weight:900;padding:9px 4px}.ko-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.scorecards-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.scorecard{background:#fff;border:2px solid #111;padding:8px;break-inside:avoid;color:#111;font-family:Arial,Helvetica,sans-serif}.scorecard-title{text-align:center;font-size:18px;font-weight:800;border:2px solid #111;padding:4px;margin-bottom:5px;text-transform:uppercase}.scorecard-info{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:11px;margin-bottom:4px}.scorecard-info div{border-bottom:1px dotted #333;min-height:20px}.scorecard-vs{text-align:center;font-weight:700;border-bottom:2px solid #111;padding:4px 0;margin-bottom:2px}.player-lines{display:grid;grid-template-columns:1fr 44px 1fr;border-left:1px solid #111;border-right:1px solid #111}.player-lines>div{min-height:21px;border-bottom:1px solid #777;padding:3px 5px;font-size:10px}.player-lines .pos{text-align:center;font-weight:700;border-left:1px solid #111;border-right:1px solid #111}.score-table{width:100%;border-collapse:collapse;min-width:0}.score-table th,.score-table td{border:1px solid #111;padding:0;text-align:center;font-size:9px;height:18px}.score-table th{background:#fff;font-size:9px;letter-spacing:0}.score-table .endnum{width:34px;font-weight:700}.score-table .shot{width:22%}.score-table .running{width:22%}.scorecard-total{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;font-weight:800;margin-top:4px}.scorecard-total div{border-bottom:2px solid #111;padding:4px}.scorecard-foot{font-size:8px;text-align:center;margin-top:5px}.scorecard-actions{display:flex;gap:8px;flex-wrap:wrap}.noPrint{}
@media print{
header,.toolbar,.tabs,.bottom,.noPrint,#syncNotice{display:none!important}
.wrap{max-width:none;padding:0}
.scorecards-grid{display:grid!important;gap:3mm}
.scorecard{border-radius:0;min-height:0;break-inside:avoid;page-break-inside:avoid}
.scorecard-title{font-weight:800}
.scorecard-info{line-height:1.15}
.score-table th,.score-table td{height:auto;min-height:0}
.scorecard-foot{line-height:1.1}

/* 8 per A3: 4 across x 2 rows */
.scorecards-grid.print-8{grid-template-columns:repeat(4,1fr)}
.scorecards-grid.print-8 .scorecard{height:137mm;padding:2mm}
.scorecards-grid.print-8 .scorecard-title{font-size:9px;padding:2px;margin-bottom:2px}
.scorecards-grid.print-8 .scorecard-info{font-size:6px;gap:2px 5px;margin-bottom:2px}
.scorecards-grid.print-8 .scorecard-info div{min-height:12px}
.scorecards-grid.print-8 .scorecard-vs{font-size:8px;padding:2px 0;margin-bottom:1px}
.scorecards-grid.print-8 .player-lines>div{font-size:6px;min-height:12px;padding:1px 3px}
.scorecards-grid.print-8 .score-table th,.scorecards-grid.print-8 .score-table td{font-size:5.5px}
.scorecards-grid.print-8 .score-table tr{height:4.6mm}
.scorecards-grid.print-8 .scorecard-total{font-size:7px;margin-top:2px}
.scorecards-grid.print-8 .scorecard-total div{padding:2px}
.scorecards-grid.print-8 .scorecard-foot{font-size:4.5px;margin-top:2px}

/* 6 per A3: 3 across x 2 rows */
.scorecards-grid.print-6{grid-template-columns:repeat(3,1fr)}
.scorecards-grid.print-6 .scorecard{height:137mm;padding:2.4mm}
.scorecards-grid.print-6 .scorecard-title{font-size:10px;padding:2px;margin-bottom:2px}
.scorecards-grid.print-6 .scorecard-info{font-size:6.8px;gap:2px 6px;margin-bottom:2px}
.scorecards-grid.print-6 .scorecard-info div{min-height:13px}
.scorecards-grid.print-6 .scorecard-vs{font-size:9px;padding:2px 0;margin-bottom:1px}
.scorecards-grid.print-6 .player-lines>div{font-size:6.5px;min-height:13px;padding:1px 3px}
.scorecards-grid.print-6 .score-table th,.scorecards-grid.print-6 .score-table td{font-size:6px}
.scorecards-grid.print-6 .score-table tr{height:5mm}
.scorecards-grid.print-6 .scorecard-total{font-size:7.5px;margin-top:2px}
.scorecards-grid.print-6 .scorecard-total div{padding:2px}
.scorecards-grid.print-6 .scorecard-foot{font-size:5px;margin-top:2px}

/* 4 per A3 for longer games */
.scorecards-grid.print-4{grid-template-columns:repeat(4,1fr)}
.scorecards-grid.print-4 .scorecard{height:278mm;padding:3mm}
.scorecards-grid.print-4 .scorecard-title{font-size:12px}
.scorecards-grid.print-4 .scorecard-info{font-size:8px}

.scorecards-grid.print-4 .scorecard-total{font-size:9px}
.scorecards-grid.print-4 .scorecard-foot{font-size:6px}

@page{size:A3 landscape;margin:6mm}
}

ight:800}.tv-controls{display:flex;gap:10px;align-items:center}.tv-controls button{border:1px solid #475569;background:#0f172a;color:#fff;padding:9px 13px;border-radius:10px;font-size:14px}@media(max-width:900px){.tv-wrap{padding:22px}.tv-head h1{font-size:30px}.tv-grid{grid-template-columns:1fr}.tv-table th,.tv-table td{font-size:18px}.tv-match{font-size:22px}.tv-footer{left:22px;right:22px}}

<body>
<header class="top">
  <div class="brand"><div class="ball"></div><div><h1>One Stop Bowling Software</h1><small id="subtitle">Live tournament management</small></div></div>
  <div class="rolebar"><button data-role="public" class="active">Public View</button><button data-role="scorer">Scorer</button><button data-role="admin">Admin</button><button id="accountBtn">Sign in</button></div>
</header>
<main class="wrap">
  <div class="notice" id="syncNotice">Offline mode: tournaments and scores are saved on this device. Use Backup regularly to save a copy you can restore on another device.</div>
  <div class="toolbar">
    <select id="competitionSelect" class="grow"></select>
    <button class="btn primary" id="newTournamentBtn">+ New Tournament</button>
    <button class="btn secondary" id="myTournamentsBtn">My Tournaments</button>
    <button class="btn secondary" id="accessBtn">Invite / Access</button>
    <button class="btn secondary" id="openCodeBtn">Open Code</button>
    <button class="btn secondary" id="shareTournamentBtn">Share Tournament</button>
    <button class="btn secondary" id="exportBtn">Backup</button>
    <label class="btn secondary" style="cursor:pointer">Restore<input id="importFile" type="file" accept="application/json" hidden></label>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <section id="screen"></section>
</main>
<nav class="bottom" id="bottomNav"></nav>
<div class="modal hidden" id="authModal"><div class="modalbox">
<h3 id="authTitle">Sign in</h3>
<p class="muted" id="authText">Sign in to manage or score tournaments.</p>

async function showMyTournaments(){
 if(!currentUser){showAuthModal('admin');return}

 let box=document.createElement('div');box.className='modal';box.id='myTournamentsModal';
 box.innerHTML=`<div class="modalbox" style="width:min(780px,100%);max-height:90vh;overflow:auto">
   <div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2 style="margin:0">My Tournaments</h2><p class="muted" style="margin:5px 0 0">Tournaments linked to your signed-in account.</p></div><button class="btn secondary" id="closeMyTournaments">Close</button></div>
   <div id="myTournamentsList" style="margin-top:15px"><p class="muted">Loading tournaments…</p></div>
 </div>`;
 document.body.appendChild(box);
 document.getElementById('closeMyTournaments').onclick=()=>box.remove();
 box.onclick=e=>{if(e.target===box)box.remove()};
 let {data,error}=await cloud.rpc('bowls_list_my_tournaments');
 let list=document.getElementById('myTournamentsList');if(!list)return;
 if(error){list.innerHTML=`<div class="notice">Could not load tournaments: ${esc(error.message)}</div>`;return}
 let rows=Array.isArray(data)?data:[];
 if(!rows.length){list.innerHTML='<div class="card" style="box-shadow:none"><h3>No saved tournaments yet</h3><p class="muted">Create a tournament and it will appear here automatically.</p></div>';return}
 // Keep active tournaments at the top and archived tournaments at the bottom.
 // Within each section, show the newest tournament first.
 rows=rows.slice().sort((a,b)=>{
   let aArchived=tournamentStateStatus(a)==='Archived'?1:0;
   let bArchived=tournamentStateStatus(b)==='Archived'?1:0;
   if(aArchived!==bArchived)return aArchived-bArchived;
   let ad=tournamentStatePrimary(a)?.created||a?.created_at||a?.updated_at||'';
   let bd=tournamentStatePrimary(b)?.created||b?.created_at||b?.updated_at||'';
   return new Date(bd||0)-new Date(ad||0);
 });
 list.innerHTML=rows.map((r,i)=>{
   let c=tournamentStatePrimary(r),status=tournamentStateStatus(r),roleLabel=r.access_role==='owner'?'Organiser':(r.access_role||'Public');
   let canManage=['owner','admin'].includes(r.access_role||'');
   return `<div class="card" style="box-shadow:none" data-my-row="${i}">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">
      <div style="min-width:220px;flex:1"><h3 style="margin-bottom:5px">${esc((c?.title||r.title||'Untitled tournament').trim())}</h3>
       <div class="meta">Code <b>${esc(r.code||'—')}</b>${r.club_name?' • Club <b>'+esc(r.club_name)+'</b>':''} • Created ${esc(tournamentCreatedLabel(r))}</div>

      </div>
      <div style="display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end">
       <button class="btn primary" data-my-open="${i}">Open Tournament</button>
       ${canManage?`<button class="btn secondary" data-my-duplicate="${i}">Duplicate</button>`:''}
       ${canManage&&status!=='Archived'?`<button class="btn secondary" data-my-archive="${i}">Archive</button>`:''}
      </div>
    </div>
   </div>`
 }).join('');
 list.querySelectorAll('[data-my-open]').forEach(b=>b.onclick=()=>openSavedTournament(rows[+b.dataset.myOpen]));
 list.querySelectorAll('[data-my-duplicate]').forEach(b=>b.onclick=()=>duplicateSavedTournament(rows[+b.dataset.myDuplicate]));
 list.querySelectorAll('[data-my-archive]').forEach(b=>b.onclick=()=>archiveSavedTournament(rows[+b.dataset.myArchive]))
}

async function pushScoreDiff(before,after){
 if(!(cloudReady&&remoteTournamentId&&canWriteRemoteTournament()))return true;
 let c=comp(),ok=true;
 for(let k of Object.keys(after||{})){
  let a=before?.[k]?.data,b=after?.[k]?.data;
  if(JSON.stringify(a??null)===JSON.stringify(b??null))continue;
  let kind='',item='';
  if(k.startsWith('agg:')){kind='aggregate';item=k.slice(4)}
  else if(k.startsWith('fixture:')){kind='fixture';item=k.slice(8)}
  else if(k.startsWith('ko:')){kind='knockout';item=k.slice(3)}
  else continue;
  let {error}=await cloud.rpc('bowls_patch_score',{
   p_id:remoteTournamentId,
   p_comp_id:c.id,
   p_kind:kind,
   p_item:String(item),
   p_patch:scorePatchData(b)
  });
  if(error){console.error('Score patch failed',error);ok=false}
 }
 if(ok){remoteLastPushAt=Date.now();setTournamentNotice();setTimeout(refreshRemoteTournament,700)}
 else setSyncNotice('Score save failed online • retry before leaving this screen',false);
 return ok
}

async function auditScoreDiff(before,after){for(let k of new Set([...Object.keys(before||{}),...Object.keys(after||{})])){let a=before?.[k],b=after?.[k];if(JSON.stringify(a?.data??null)!==JSON.stringify(b?.data??null))await auditEvent('score_change',b?.target||a?.target||k,a?.data??null,b?.data??null)}}

 let actions=document.getElementById('drawShareActions');if(actions)actions.style.display='none';
 try{
   if(typeof html2canvas!=='function'){alert('Image export is unavailable right now. Please use Print Draw.');return}
   let canvas=await html2canvas(s,{backgroundColor:'#ffffff',scale:2,useCORS:true,logging:false,windowWidth:Math.max(document.documentElement.scrollWidth,1100)});
   let blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png',0.95));
   if(!blob)throw new Error('Image creation failed');
   let title=((comp().title||'').trim()||'Bowls Competition')+' Draw';
   let name=(title.replace(/[^a-z0-9-_]+/gi,'-').replace(/^-+|-+$/g,'')||'bowls-draw')+'.png';
   let file=new File([blob],name,{type:'image/png'});
   if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
     await navigator.share({title,text:'Tournament draw',files:[file]});
   }else{
     let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
   }
 }catch(e){
   if(e?.name!=='AbortError'){console.error(e);alert('Could not create the draw image. Please use Print Draw instead.')}
 }finally{if(actions)actions.style.display='flex'}
}

function completed(f){return Number.isFinite(+f.scoreA)&&Number.isFinite(+f.scoreB)&&f.scoreA!==''&&f.scoreB!==''}
function isAggregate(c=comp()){return (c.settings.tournamentType||'standard')==='aggregate'}
function ensureAggregate(c=comp()){let x=c.settings,n=Math.max(1,+x.aggregateRinks||6);c.aggregateScores=c.aggregateScores||[];while(c.aggregateScores.length<n)c.aggregateScores.push({rink:c.aggregateScores.length+1,scoreA:'',scoreB:'',skipA:'',skipB:''});c.aggregateScores=c.aggregateScores.slice(0,n);c.aggregateScores.forEach((r,i)=>{r.rink=i+1;r.skipA=r.skipA||'';r.skipB=r.skipB||''});return c.aggregateScores}
function aggregateTotals(c=comp()){let rows=ensureAggregate(c),a=0,b=0,complete=0;rows.forEach(r=>{let s=currentScore(r);if(completed(r))complete++;a+=s.a;b+=s.b});return {a,b,complete,total:rows.length}}
function standings(c=comp()){
 let out={};c.teams.forEach(t=>out[t.group]??=[]);c.teams.forEach(t=>{if(t.group)out[t.group].push({id:t.id,name:t.name,p:0,w:0,d:0,l:0,sf:0,sa:0,sd:0,pts:0})});
 let map={};Object.values(out).flat().forEach(r=>map[r.id]=r);
 c.fixtures.filter(completed).forEach(f=>{let a=map[f.a],b=map[f.b];if(!a||!b)return;let sa=+f.scoreA,sb=+f.scoreB;a.p++;b.p++;a.sf+=sa;a.sa+=sb;b.sf+=sb;b.sa+=sa;if(sa>sb){a.w++;b.l++;a.pts+=c.settings.winPts}else if(sb>sa){b.w++;a.l++;b.pts+=c.settings.winPts}else if(sa===0&&sb===0){}else{a.d++;b.d++;a.pts+=c.settings.drawPts;b.pts+=c.settings.drawPts}});
 Object.values(out).forEach(rows=>rows.forEach(r=>r.sd=r.sf-r.sa));Object.values(out).forEach(rows=>rows.sort((a,b)=>b.pts-a.pts||b.sd-a.sd||b.sf-a.sf||a.name.localeCompare(b.name)));return out
}


function qualifiers(c=comp()){
 let st=standings(c),groups=Object.keys(st).filter(g=>g).sort();
 if(!groups.length)return [];
 let mode=c.settings?.qualify||'winner_best_runner',best=Math.max(0,+c.settings?.bestRunners||0),out=[];
 groups.forEach(g=>{let rows=st[g]||[];if(rows[0])out.push({...rows[0],group:g,pos:1})});
 if(mode==='top2'){
  groups.forEach(g=>{let rows=st[g]||[];if(rows[1])out.push({...rows[1],group:g,pos:2})});
 }else if(mode==='winner_best_runner'&&best>0){
  let runners=groups.map(g=>{let r=(st[g]||[])[1];return r?{...r,group:g,pos:2}:null}).filter(Boolean);
  runners.sort((a,b)=>b.pts-a.pts||b.sd-a.sd||b.sf-a.sf||a.name.localeCompare(b.name));
  out.push(...runners.slice(0,best));
 }
 return out;
}

}

function pickFullestSession(pending,rinks,prevTeams=new Set()){
 // Primary goal: fill as many rinks as possible. Secondary goal: where equally full
 // schedules exist, prefer teams that did NOT play in the previous session.
 let best=[],bestBack=Infinity;let tries=Math.min(900,150+pending.length*10);
 for(let t=0;t<tries;t++){
  let used=new Set(),slot=[];
  let degree={};pending.forEach(z=>{degree[z.a.id]=(degree[z.a.id]||0)+1;degree[z.b.id]=(degree[z.b.id]||0)+1});
  let order=[...pending].sort((u,v)=>{
   let ub=(prevTeams.has(u.a.id)?1:0)+(prevTeams.has(u.b.id)?1:0),vb=(prevTeams.has(v.a.id)?1:0)+(prevTeams.has(v.b.id)?1:0);
   let du=degree[u.a.id]+degree[u.b.id],dv=degree[v.a.id]+degree[v.b.id];
   if(t===0)return ub-vb||dv-du||u.round-v.round;
   return (ub-vb)*4+(dv-du)*.12+(u.round-v.round)*.02+(Math.random()-.5)*3;
  });
  for(let z of order){if(slot.length>=rinks)break;if(!used.has(z.a.id)&&!used.has(z.b.id)){slot.push(z);used.add(z.a.id);used.add(z.b.id)}}
  let back=slot.reduce((n,z)=>n+(prevTeams.has(z.a.id)?1:0)+(prevTeams.has(z.b.id)?1:0),0);
  if(slot.length>best.length||(slot.length===best.length&&back<bestBack)){best=slot;bestBack=back}
  if(best.length===rinks&&bestBack===0)break;
 }
 return best.length?best:[pending[0]];
}
function sessionTeams(slot){return new Set(slot.flatMap(z=>[z.a.id,z.b.id]))}
function sessionBalanceScore(slots,rinks){
 let live=slots.filter(x=>x.length),btb=backToBackStats(live).count,loads=live.map(x=>x.length),avg=loads.length?loads.reduce((a,b)=>a+b,0)/loads.length:0;
 let spread=loads.reduce((n,x)=>n+Math.pow(x-avg,2),0),thin=loads.length?Math.max(0,rinks-loads[loads.length-1]):0;

function rebalanceSessions(slots,rinks){

 while(guard++<250){
  let base=sessionBalanceScore(work,rinks),best=null,bestScore=base;
  for(let si=0;si<work.length;si++){
   for(let gi=0;gi<work[si].length;gi++){
    let game=work[si][gi],ids=new Set([game.a.id,game.b.id]);
    for(let di=0;di<work.length;di++){
     if(di===si||work[di].length>=rinks)continue;
     let destTeams=sessionTeams(work[di]);if([...ids].some(id=>destTeams.has(id)))continue;
     let trial=work.map(x=>[...x]);trial[si].splice(gi,1);trial[di].push(game);trial=trial.filter(x=>x.length);
     let score=sessionBalanceScore(trial,rinks);
     if(score<bestScore){best={si,gi,di};bestScore=score}
    }
   }
  }
  if(!best)break;
  let game=work[best.si].splice(best.gi,1)[0],destIndex=best.di;
  if(!work[best.si].length&&best.si<destIndex)destIndex--;

}

function groupOptions(n,rinks,minutes,koMinutes,start,target,qualify,bestRunners,mode='balanced',eventFormat='same_day',day1Target='21:00',day2Start='09:00'){
 let candidates=[];
 for(let g=3;g<=Math.min(8,n);g++){
  let p=fullTournamentPlan(n,g,rinks,minutes,koMinutes,start,target,qualify,bestRunners,eventFormat,day1Target,day2Start),min=Math.min(...p.sizes),avg=n/p.sizes.length;

  let {data:members,error:merr}=await cloud.rpc('bowls_list_tournament_members',{p_id:remoteTournamentId});
  if(mb){
   if(merr)mb.innerHTML='<p>Could not load tournament users.</p>';
   else mb.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Tournament role</th></tr></thead><tbody>${(members||[]).map(u=>`<tr><td>${esc(u.display_name||'')}</td><td>${esc(u.email||'')}</td><td>${u.role==='owner'?'<b>Owner</b>':`<select data-tournament-role="${u.user_id}"><option value="pending" ${u.role==='pending'?'selected':''}>Pending</option><option value="scorer" ${u.role==='scorer'?'selected':''}>Scorer</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select>`}</td></tr>`).join('')}</tbody></table></div>`;
   mb.querySelectorAll('[data-tournament-role]').forEach(sel=>sel.onchange=async()=>{let {error}=await cloud.rpc('bowls_set_tournament_member_role',{p_id:remoteTournamentId,p_user:sel.dataset.tournamentRole,p_role:sel.value});if(error)alert(error.message);else{loadAdminExtras();setTimeout(refreshAccessNotificationBadge,250)}})
  }
 }
 if(globalAdmin&&auditBox){
  let {data:logs,error:lerr}=await cloud.from('bowls_audit_log').select('id,user_email,user_role,action,target,old_value,new_value,created_at').eq('competition_id',comp().id).order('created_at',{ascending:false}).limit(100);
  if(lerr)auditBox.innerHTML='<p>Could not load audit history.</p>';
  else if(!logs?.length)auditBox.innerHTML='<p class="muted">No score changes have been logged yet.</p>';
  else auditBox.innerHTML=`<div class="tablewrap"><table><thead><tr><th>When</th><th>User</th><th>Action</th><th>Target</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${new Date(l.created_at).toLocaleString()}</td><td>${esc(l.user_email||'Unknown')}<div class="meta">${esc(l.user_role||'')}</div></td><td>${esc((l.action||'').replaceAll('_',' '))}</td><td>${esc(l.target||'')}</td></tr>`).join('')}</tbody></table></div>`
 }
}

function setQueryRole(r){try{let u=new URL(location.href);u.searchParams.set('view',r);history.replaceState({},'',u)}catch(e){}}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>requestRole(b.dataset.role));
document.getElementById('authCancel').onclick=()=>document.getElementById('authModal').classList.add('hidden');
document.getElementById('authModeSignin').onclick=()=>setAuthMode('signin');
document.getElementById('authModeSignup').onclick=()=>setAuthMode('signup');

document.getElementById('authPassword2').onkeydown=e=>{if(e.key==='Enter'&&authMode==='signup')createAccount()};
document.getElementById('accountBtn').onclick=()=>{if(currentUser){if(confirm(`Signed in as ${currentUser.email}. Sign out?`))signOutAccount()}else showAuthModal('scorer','signin')};
document.getElementById('newTournamentBtn').onclick=showNewTournamentWizard;
document.getElementById('myTournamentsBtn').onclick=showMyTournaments;
document.getElementById('accessBtn').onclick=showTournamentAccess;
document.getElementById('openCodeBtn').onclick=()=>openTournamentByCode();
document.getElementById('shareTournamentBtn').onclick=createShareableTournament;
document.getElementById('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bowls-tournament-backup.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.competitions)throw 0;db=x;saveDB();render()}catch{alert('That backup file could not be read.')}};r.readAsText(f)};
function tvCurrentGames(c){
 let fs=c.fixtures||[];
 if(!fs.length)return[];
 let live=fs.filter(f=>!completed(f)&&currentScore(f).live);
 if(live.length)return live;
 let pending=fs.filter(f=>!completed(f));
 let currentSession=pending.length?Math.min(...pending.map(f=>f.session)):Math.max(...fs.map(f=>f.session));
 return fs.filter(f=>f.session===currentSession)
}
function tvUpcoming(c){
 let fs=c.fixtures||[],pending=fs.filter(f=>!completed(f));
 if(!pending.length)return[];
 let sessions=[...new Set(pending.map(f=>f.session))].sort((a,b)=>a-b);
 let current=sessions[0],next=sessions.find(s=>s>current);
 let target=next??current;
 return pending.filter(f=>f.session===target).slice(0,16)
}
function tvTableHTML(c,onlyGroups=null){
 let st=standings(c),keys=(onlyGroups&&onlyGroups.length?onlyGroups:Object.keys(st).sort());
 if(!keys.length)return '<div class="tv-empty">Group tables will appear after the draw.</div>';
 return `<div class="tv-grid">${keys.map(g=>`<div class="tv-card"><h2>Group ${g}</h2><table class="tv-table"><thead><tr><th>Pos</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>SD</th><th>Pts</th></tr></thead><tbody>${(st[g]||[]).map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.name)}</b></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.sd>0?'+':''}${r.sd}</td><td><b>${r.pts}</b></td></tr>`).join('')}</tbody></table></div>`).join('')}</div>`
}
function tvStandingPages(c){
 let keys=Object.keys(standings(c)).sort();
 if(!keys.length)return [{title:'Current Standings',body:()=>tvTableHTML(c)}];
 let out=[];
 for(let i=0;i<keys.length;i+=2){
  let chunk=keys.slice(i,i+2);
  out.push({title:`Current Standings • Groups ${chunk.join(' & ')}`,body:()=>tvTableHTML(c,chunk)});
 }
 return out;
}
function tvMatchesHTML(rows,title,empty,c=comp()){
 if(!rows.length)return `<div class="tv-empty">${empty}</div>`;
 return `<div class="tv-card"><h2>${title}</h2><div class="tv-big-list">${rows.map(f=>{let cs=currentScore(f),score=completed(f)?`${f.scoreA} – ${f.scoreB}`:cs.live?`${cs.a} – ${cs.b}`:'vs',status=completed(f)?'FINAL':cs.live?(cs.ends?`LIVE • ${cs.ends} ends`:'LIVE'):`${f.start||''}`;return `<div class="tv-match"><div><b>${esc(fixtureTeamName(f,'a',c))}</b><div class="tv-muted" style="font-size:16px">${esc(fixtureVenue(f,c))} • Group ${esc(f.group||'')} • Rink ${fixtureLocalRink(f,c)}</div></div><div class="score">${score}<div class="tv-muted" style="font-size:14px;text-align:center">${status}</div></div><div class="right"><b>${esc(fixtureTeamName(f,'b',c))}</b><div class="tv-muted" style="font-size:16px">${f.start||''}${f.game?` • Game ${f.game}`:''}</div></div></div>`}).join('')}</div></div>`
}
function tvUpcomingCompactHTML(rows,c=comp()){
 if(!rows.length)return '<div class="tv-empty">No upcoming fixtures.</div>';
 let byVenue={};rows.forEach(f=>{let v=fixtureVenue(f,c)||'Main Green';(byVenue[v]??=[]).push(f)});
 return `<div class="tv-next-grid">${Object.entries(byVenue).map(([v,items])=>`<div class="tv-next-venue"><h2>${esc(v)} • ${items[0]?.start||''}</h2>${items.sort((a,b)=>fixtureLocalRink(a,c)-fixtureLocalRink(b,c)).map(f=>`<div class="tv-next-row"><div class="rink">Rink ${fixtureLocalRink(f,c)}</div><div><b>${esc(fixtureTeamName(f,'a',c))}</b><div class="tv-muted" style="font-size:12px">Group ${esc(f.group||'')}</div></div><div class="versus">v</div><div><b>${esc(fixtureTeamName(f,'b',c))}</b></div></div>`).join('')}</div>`).join('')}</div>`
}
function aggregateEndsProgress(c){
 let x=c.settings,rows=ensureAggregate(c),perRink=Math.max(0,+x.ends||0),total=perRink*rows.length,played=0;
 rows.forEach(r=>{
  if(completed(r)){played+=perRink;return}
  let cs=currentScore(r);
  if(cs.live){
   let e=Math.max(0,Math.min(perRink,+cs.ends||0));
   played+=e
  }
 });
 played=Math.min(total,played);
 return {total,played,remaining:Math.max(0,total-played),perRink,rinks:rows.length}
}
function tvAggregateOverallHTML(c){
 let x=c.settings,rows=ensureAggregate(c),liveA=0,liveB=0,complete=0,ep=aggregateEndsProgress(c);
 rows.forEach(r=>{let cs=currentScore(r);if(completed(r)){liveA+=+r.scoreA||0;liveB+=+r.scoreB||0;complete++}else if(cs.live){liveA+=cs.a;liveB+=cs.b}});
 return `<div class="tv-card"><h2>Overall Match Score</h2><div style="display:grid;grid-template-columns:1fr auto 1fr;gap:30px;align-items:center;text-align:center;padding:25px 10px"><div><div style="font-size:30px;font-weight:800">${esc(x.aggregateSideA||'Side A')}</div><div style="font-size:72px;font-weight:900">${liveA}</div></div><div style="font-size:44px;font-weight:900">–</div><div><div style="font-size:30px;font-weight:800">${esc(x.aggregateSideB||'Side B')}</div><div style="font-size:72px;font-weight:900">${liveB}</div></div></div>
 <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:10px">
   <div style="background:#111827;border:1px solid #334155;border-radius:14px;padding:18px;text-align:center"><div class="tv-muted" style="font-size:16px">Total Ends</div><div style="font-size:38px;font-weight:900">${ep.total}</div><div class="tv-muted" style="font-size:14px">${ep.perRink} ends × ${ep.rinks} rinks</div></div>
   <div style="background:#111827;border:1px solid #334155;border-radius:14px;padding:18px;text-align:center"><div class="tv-muted" style="font-size:16px">Ends Played</div><div style="font-size:38px;font-weight:900">${ep.played}</div></div>
   <div style="background:#111827;border:1px solid #334155;border-radius:14px;padding:18px;text-align:center"><div class="tv-muted" style="font-size:16px">Ends Remaining</div><div style="font-size:46px;font-weight:900">${ep.remaining}</div></div>
 </div>
 <div class="tv-muted" style="text-align:center;font-size:18px;margin-top:16px">${complete}/${rows.length} rinks final • live rink totals included</div></div>`
}
function tvAggregateRinksHTML(c){
 let x=c.settings,rows=ensureAggregate(c);
 return `<div class="tv-card"><h2>Rink-by-Rink Scores</h2><table class="tv-table"><thead><tr><th>Rink</th><th>${esc(x.aggregateSideA||'Side A')}</th><th>Score</th><th>${esc(x.aggregateSideB||'Side B')}</th><th>Status</th></tr></thead><tbody>${rows.map(r=>{let cs=currentScore(r),score=completed(r)?`${r.scoreA} – ${r.scoreB}`:cs.live?`${cs.a} – ${cs.b}`:'—',status=completed(r)?'FINAL':cs.live?(cs.ends?`LIVE • ${cs.ends} ends`:'LIVE'):'WAITING';return `<tr><td><b>${r.rink}</b></td><td><b>${esc(r.skipA||x.aggregateSideA||'Side A')}</b></td><td class="tv-score">${score}</td><td><b>${esc(r.skipB||x.aggregateSideB||'Side B')}</b></td><td>${status}</td></tr>`}).join('')}</tbody></table></div>`
}
function knockoutTvPending(c){
 return (c.knockout||[]).flat().filter(m=>knockoutEntryReady(m.a)&&knockoutEntryReady(m.b)&&!completed(m));
}
function knockoutTvBatch(c){
 let pending=knockoutTvPending(c);
 if(!pending.length)return {current:[],upcoming:[]};
 let live=pending.filter(m=>currentScore(m).live),anchor='';
 if(live.length){
  anchor=(live.map(m=>m.start||'').filter(Boolean).sort()[0]||'');
 }else{
  anchor=(pending.map(m=>m.start||'').filter(Boolean).sort()[0]||'');
 }
 let current=anchor?pending.filter(m=>(m.start||'')===anchor):pending.slice(0,8);
 let later=[...new Set(pending.map(m=>m.start||'').filter(t=>t&&(!anchor||t>anchor)))].sort();
 let nextTime=later[0]||'';
 let upcoming=nextTime?pending.filter(m=>(m.start||'')===nextTime):[];
 return {current,upcoming,anchor,nextTime};
}
function tvKnockoutSessionHTML(c){
 let batch=knockoutTvBatch(c),rows=batch.current;
 if(!rows.length)return '<div class="tv-empty">No knockout games are waiting to be played.</div>';
 let anyLive=rows.some(m=>currentScore(m).live),title=anyLive?'Current Knockout Games':'Next Knockout Games';
 return `<div class="tv-card"><h2>${title}${batch.anchor?` • ${batch.anchor}`:''}</h2><div class="tv-big-list">${rows.map(m=>{let cs=currentScore(m),score=cs.live?`${cs.a} – ${cs.b}`:'vs',status=cs.live?(cs.ends?`LIVE • ${cs.ends} ends`:'LIVE'):(m.start||'');return `<div class="tv-match"><div><b>${esc(knockoutRefName(m.a,c))}</b><div class="tv-muted" style="font-size:16px">${esc(m.roundName||m.label||'')} • ${esc(knockoutVenueName(m,c))} • Rink ${m.rink||'—'}</div></div><div class="score">${score}<div class="tv-muted" style="font-size:14px;text-align:center">${status}</div></div><div class="right"><b>${esc(knockoutRefName(m.b,c))}</b><div class="tv-muted" style="font-size:16px">${m.start||''}</div></div></div>`}).join('')}</div></div>`
}
function tvKnockoutUpcomingHTML(c){
 let batch=knockoutTvBatch(c),rows=batch.upcoming;
 if(!rows.length)return '<div class="tv-empty">No later knockout session is currently scheduled.</div>';
 return `<div class="tv-card"><h2>Up Next${batch.nextTime?` • ${batch.nextTime}`:''}</h2><div class="tv-big-list">${rows.map(m=>`<div class="tv-match"><div><b>${esc(knockoutRefName(m.a,c))}</b><div class="tv-muted" style="font-size:16px">${esc(m.roundName||m.label||'')} • ${esc(knockoutVenueName(m,c))} • Rink ${m.rink||'—'}</div></div><div class="score">vs<div class="tv-muted" style="font-size:14px;text-align:center">${m.start||''}</div></div><div class="right"><b>${esc(knockoutRefName(m.b,c))}</b></div></div>`).join('')}</div></div>`
}
function tvKnockoutLiveHTML(c){return tvKnockoutSessionHTML(c)}
function tvKnockoutDrawHTML(c){
 let rounds=c.knockout||[];
 if(!rounds.length)return '<div class="tv-empty">The knockout draw has not been generated yet.</div>';
 return `<div class="tv-grid">${rounds.map((round,ri)=>`<div class="tv-card"><h2>${esc(round[0]?.roundName||(ri===rounds.length-1?'Final':'Round '+(ri+1)))}</h2>${round.map(m=>{let cs=currentScore(m),score=completed(m)?`${m.scoreA} – ${m.scoreB}`:cs.live?`${cs.a} – ${cs.b}`:'v';return `<div style="border-bottom:1px solid #334155;padding:12px 0"><div style="display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;font-size:20px"><b>${esc(knockoutRefName(m.a,c))}</b><span class="tv-score" style="font-size:24px">${score}</span><b style="text-align:right">${esc(knockoutRefName(m.b,c))}</b></div><div class="tv-muted" style="font-size:14px;text-align:center">${esc(knockoutVenueName(m,c))}${m.rink?` • Rink ${m.rink}`:''}${m.start?` • ${m.start}`:''}${cs.live&&!completed(m)?` • LIVE${cs.ends?` after ${cs.ends} ends`:''}`:''}</div></div>`}).join('')}</div>`).join('')}</div>`
}
function tvFinalsHTML(c){return tvKnockoutDrawHTML(c)}
let tvPage=0,tvTimer=null,tvPaused=false,tvDisplayMode='auto';
function tvModeStorageKey(c=comp()){return 'oneStopBowlsTvMode:'+(remoteTournamentCode||c?.id||'local')}
function loadTvDisplayMode(c=comp()){try{let v=localStorage.getItem(tvModeStorageKey(c));if(['auto','groups','knockout'].includes(v))tvDisplayMode=v}catch(e){}return tvDisplayMode}
function setTvDisplayMode(mode,c=comp()){tvDisplayMode=['auto','groups','knockout'].includes(mode)?mode:'auto';try{localStorage.setItem(tvModeStorageKey(c),tvDisplayMode)}catch(e){}tvPage=0;renderTv()}
function effectiveTvDisplayMode(c=comp()){let mode=loadTvDisplayMode(c);if(mode!=='auto')return mode;let groupsFinished=(c.fixtures||[]).length>0&&(c.fixtures||[]).every(completed);return groupsFinished&&(c.knockout||[]).length?'knockout':'groups'}

function tvPagesFor(c){
 if(isAggregate(c))return [
  {title:'Overall Score',body:()=>tvAggregateOverallHTML(c)},
  {title:'Rink-by-Rink Scores',body:()=>tvAggregateRinksHTML(c)}
 ];
 if((c.settings.tournamentType||'standard')==='knockout')return [
  {title:'Current Games',body:()=>tvKnockoutSessionHTML(c)},
  {title:'Up Next',body:()=>tvKnockoutUpcomingHTML(c)},
  {title:'Full Draw',body:()=>tvKnockoutDrawHTML(c)}
 ];
 let mode=effectiveTvDisplayMode(c);
 if(mode==='knockout')return [
  {title:'Current Knockout Games',body:()=>tvKnockoutSessionHTML(c)},
  {title:'Up Next',body:()=>tvKnockoutUpcomingHTML(c)},
  {title:'Knockout Draw',body:()=>tvKnockoutDrawHTML(c)}
 ];
 return [
  {title:'Live Rink Scores',body:()=>tvMatchesHTML(tvCurrentGames(c),'Live / Current Games','No games are currently live.',c)},
  ...tvStandingPages(c),
  {title:'Up Next',body:()=>tvUpcomingCompactHTML(tvUpcoming(c),c)}
 ];
}
function renderTv(){
 let c=comp(),pages=tvPagesFor(c),idx=tvPage%pages.length,p=pages[idx],body=p.body(),effective=effectiveTvDisplayMode(c),modeLabel=tvDisplayMode==='auto'?`Auto: ${effective==='knockout'?'Knockout':'Groups'}`:(tvDisplayMode==='knockout'?'Knockout':'Groups');
 document.body.className='tv-mode';
 document.body.innerHTML=`<div class="tv-wrap"><div class="tv-head"><div class="tv-head-main"><div class="tv-broadcast-brand">One Stop Bowling</div><div class="tv-titleblock"><h1>${esc(c.title)}</h1><div class="sub">${esc(c.settings.clubName||'')} • ${p.title}</div></div><span class="tv-live-badge">LIVE</span></div><div class="tv-controls"><button id="tvMode">Mode: ${modeLabel}</button><button id="tvPrev">◀</button><button id="tvPause">${tvPaused?'Resume':'Pause'}</button><button id="tvNext">▶</button><button id="tvFull">Full Screen</button></div></div>${body}<div class="tv-footer"><span>One Stop Bowling Software • TV Display</span><span>20 sec rotation • ${modeLabel} • Screen ${idx+1}/${pages.length}</span></div></div>`;
 document.getElementById('tvMode').onclick=()=>{let modes=['auto','groups','knockout'],i=modes.indexOf(tvDisplayMode);setTvDisplayMode(modes[(i+1)%modes.length],c)};
 document.getElementById('tvPrev').onclick=()=>{tvPage=(tvPage+pages.length-1)%pages.length;renderTv()};
 document.getElementById('tvNext').onclick=()=>{tvPage=(tvPage+1)%pages.length;renderTv()};
 document.getElementById('tvPause').onclick=()=>{tvPaused=!tvPaused;renderTv()};
 document.getElementById('tvFull').onclick=()=>document.documentElement.requestFullscreen?.()
}
function startTv(){
 const tvParams=new URLSearchParams(location.search),boundCode=(tvParams.get('code')||'').trim().toUpperCase(),boundComp=tvParams.get('comp')||'';
 // A TV opened for an online tournament is locked to that tournament code.
 // This prevents an older tab/localStorage selection (for example a previous NCBA event) replacing the display.
 if(boundComp&&db?.competitions?.length){let hit=db.competitions.find(x=>x.id===boundComp);if(hit)db.active=hit.id}
 renderTv();
 tvTimer=setInterval(async()=>{
  if(boundCode&&cloud){
   if(remoteTournamentCode!==boundCode)await openTournamentByCode(boundCode);
   else await refreshRemoteTournament();
  }else if(remoteTournamentCode&&cloud)await refreshRemoteTournament();
  else {try{db=loadDB();if(boundComp&&db?.competitions?.some(x=>x.id===boundComp))db.active=boundComp}catch(e){}}
  if(!tvPaused){let pages=tvPagesFor(comp());tvPage=(tvPage+1)%pages.length}
  renderTv()
 },20000);
 if(!boundCode)window.addEventListener('storage',()=>{db=loadDB();if(boundComp&&db?.competitions?.some(x=>x.id===boundComp))db.active=boundComp;renderTv()})
}
let params=new URLSearchParams(location.search);if(params.get('tv')==='1'){initCloudSync().then(()=>startTv())}else{let initial=params.get('view');render();initCloudSync().then(()=>{if(initial==='scorer'||initial==='admin')requestRole(initial)});}
</script>
