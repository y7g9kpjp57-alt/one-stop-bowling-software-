<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#082f49" />
<title>One Stop Bowling Software</title>
<style>
:root{--nav:#082f49;--blue:#0369a1;--sky:#e0f2fe;--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--green:#166534;--amber:#92400e;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#082f49,#075985);color:#fff;padding:14px 14px 10px;box-shadow:0 2px 12px #0002}.brand{display:flex;align-items:center;gap:10px}.ball{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#dbeafe 18%,#1e3a8a 20%,#082f49 72%);border:2px solid #fff8;box-shadow:inset -4px -5px 10px #0005}.brand h1{font-size:18px;margin:0}.brand small{display:block;color:#bae6fd;margin-top:2px}.rolebar{display:flex;gap:7px;margin-top:12px;overflow:auto;padding-bottom:2px}.rolebar button{white-space:nowrap;background:#ffffff18;border:1px solid #ffffff35;color:white;padding:8px 11px;border-radius:999px}.rolebar button.active{background:#fff;color:var(--nav);font-weight:700}
.wrap{max-width:1100px;margin:0 auto;padding:14px 14px 90px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar select,.toolbar input{background:#fff;border:1px solid var(--line);padding:9px 10px;border-radius:10px}.grow{flex:1}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#e2e8f0;color:#0f172a}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px;box-shadow:0 3px 12px #0f172a08}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow:auto;padding:2px 0 10px}.tabs button{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px;white-space:nowrap}.tabs button.active{background:var(--nav);color:#fff;border-color:var(--nav)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:650px;background:#fff}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{background:#f1f5f9;font-size:12px;text-transform:uppercase;letter-spacing:.03em}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.pill.done{background:#dcfce7;color:#166534}.pill.wait{background:#fef3c7;color:#92400e}.scoreline{display:grid;grid-template-columns:1fr 58px 22px 58px 1fr;gap:7px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.scoreline:last-child{border-bottom:0}.scoreline input{width:58px;text-align:center;padding:10px 5px;border:1px solid #cbd5e1;border-radius:9px;font-size:18px;font-weight:800}.scoreline .away{text-align:right}.meta{font-size:12px;color:var(--muted);margin-top:3px}.groupgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.groupbox h3{background:var(--nav);color:#fff;padding:9px 11px;border-radius:10px 10px 0 0;margin:0}.groupbox .tablewrap{border-radius:0 0 10px 10px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:700}.field input,.field select{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px;background:#fff}.teamrow{display:flex;gap:8px;margin-bottom:7px}.teamrow span{width:34px;color:var(--muted);padding-top:10px}.teamrow input{flex:1;border:1px solid #cbd5e1;border-radius:9px;padding:9px}.teamcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}.teamhead{display:grid;grid-template-columns:36px 1fr 44px;gap:8px;align-items:center}.teamplayers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.teamplayers label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px}.teamplayers input{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px}.notice{padding:10px 12px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;margin-bottom:12px}.oknotice{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}.hidden{display:none!important}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:none;z-index:20;padding-bottom:env(safe-area-inset-bottom)}.bottom button{flex:1;border:0;background:#fff;padding:10px 4px;font-size:11px;color:#475569}.bottom button.active{color:var(--blue);font-weight:800}.bottom b{display:block;font-size:18px;margin-bottom:2px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}.modalbox{background:#fff;border-radius:16px;padding:18px;width:min(390px,100%)}.modalbox input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:22px;text-align:center;letter-spacing:5px;margin:8px 0 12px}.bracket{display:grid;grid-template-columns:repeat(3,minmax(210px,1fr));gap:16px;overflow:auto}.round{min-width:210px}.match{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff;overflow:hidden}.match div{padding:8px 10px;border-bottom:1px solid var(--line)}.match div:last-child{border-bottom:0}.qual{font-size:12px;color:var(--muted)}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.groupgrid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr 1fr}.bottom{display:flex}.wrap{padding-bottom:86px}.desktopOnly{display:none}.scoreline{grid-template-columns:1fr 50px 16px 50px 1fr}.scoreline input{width:50px}.toolbar{align-items:stretch}.toolbar .grow{flex-basis:100%}}
@media(max-width:440px){.formgrid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.teamplayers{grid-template-columns:1fr}}

.scorecards-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.scorecard{background:#fff;border:2px solid #111;padding:8px;break-inside:avoid;color:#111;font-family:Arial,Helvetica,sans-serif}.scorecard-title{text-align:center;font-size:18px;font-weight:800;border:2px solid #111;padding:4px;margin-bottom:5px;text-transform:uppercase}.scorecard-info{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:11px;margin-bottom:4px}.scorecard-info div{border-bottom:1px dotted #333;min-height:20px}.scorecard-vs{text-align:center;font-weight:700;border-bottom:2px solid #111;padding:4px 0;margin-bottom:2px}.player-lines{display:grid;grid-template-columns:1fr 44px 1fr;border-left:1px solid #111;border-right:1px solid #111}.player-lines>div{min-height:21px;border-bottom:1px solid #777;padding:3px 5px;font-size:10px}.player-lines .pos{text-align:center;font-weight:700;border-left:1px solid #111;border-right:1px solid #111}.score-table{width:100%;border-collapse:collapse;min-width:0}.score-table th,.score-table td{border:1px solid #111;padding:0;text-align:center;font-size:9px;height:18px}.score-table th{background:#fff;font-size:9px;letter-spacing:0}.score-table .endnum{width:34px;font-weight:700}.score-table .shot{width:22%}.score-table .running{width:22%}.scorecard-total{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;font-weight:800;margin-top:4px}.scorecard-total div{border-bottom:2px solid #111;padding:4px}.scorecard-foot{font-size:8px;text-align:center;margin-top:5px}.scorecard-actions{display:flex;gap:8px;flex-wrap:wrap}.noPrint{}
@media print{
header,.toolbar,.tabs,.bottom,.noPrint,#syncNotice{display:none!important}
.wrap{max-width:none;padding:0}
.scorecards-grid{display:grid!important;gap:3mm}
.scorecard{border-radius:0;min-height:0;break-inside:avoid;page-break-inside:avoid}
.scorecard-title{font-weight:800}
.scorecard-info{line-height:1.15}
.score-table th,.score-table td{height:auto;min-height:0}
.scorecard-foot{line-height:1.1}

/* 8 per A3: 4 across x 2 rows */
.scorecards-grid.print-8{grid-template-columns:repeat(4,1fr)}
.scorecards-grid.print-8 .scorecard{height:137mm;padding:2mm}
.scorecards-grid.print-8 .scorecard-title{font-size:9px;padding:2px;margin-bottom:2px}
.scorecards-grid.print-8 .scorecard-info{font-size:6px;gap:2px 5px;margin-bottom:2px}
.scorecards-grid.print-8 .scorecard-info div{min-height:12px}
.scorecards-grid.print-8 .scorecard-vs{font-size:8px;padding:2px 0;margin-bottom:1px}
.scorecards-grid.print-8 .player-lines>div{font-size:6px;min-height:12px;padding:1px 3px}
.scorecards-grid.print-8 .score-table th,.scorecards-grid.print-8 .score-table td{font-size:5.5px}
.scorecards-grid.print-8 .score-table tr{height:4.6mm}
.scorecards-grid.print-8 .scorecard-total{font-size:7px;margin-top:2px}
.scorecards-grid.print-8 .scorecard-total div{padding:2px}
.scorecards-grid.print-8 .scorecard-foot{font-size:4.5px;margin-top:2px}

/* 6 per A3: 3 across x 2 rows */
.scorecards-grid.print-6{grid-template-columns:repeat(3,1fr)}
.scorecards-grid.print-6 .scorecard{height:137mm;padding:2.4mm}
.scorecards-grid.print-6 .scorecard-title{font-size:10px;padding:2px;margin-bottom:2px}
.scorecards-grid.print-6 .scorecard-info{font-size:6.8px;gap:2px 6px;margin-bottom:2px}
.scorecards-grid.print-6 .scorecard-info div{min-height:13px}
.scorecards-grid.print-6 .scorecard-vs{font-size:9px;padding:2px 0;margin-bottom:1px}
.scorecards-grid.print-6 .player-lines>div{font-size:6.5px;min-height:13px;padding:1px 3px}
.scorecards-grid.print-6 .score-table th,.scorecards-grid.print-6 .score-table td{font-size:6px}
.scorecards-grid.print-6 .score-table tr{height:5mm}
.scorecards-grid.print-6 .scorecard-total{font-size:7.5px;margin-top:2px}
.scorecards-grid.print-6 .scorecard-total div{padding:2px}
.scorecards-grid.print-6 .scorecard-foot{font-size:5px;margin-top:2px}

/* 4 per A3 for longer games */
.scorecards-grid.print-4{grid-template-columns:repeat(4,1fr)}
.scorecards-grid.print-4 .scorecard{height:278mm;padding:3mm}
.scorecards-grid.print-4 .scorecard-title{font-size:12px}
.scorecards-grid.print-4 .scorecard-info{font-size:8px}
.scorecards-grid.print-4 .player-lines>div{font-size:8px;min-height:17px}
.scorecards-grid.print-4 .score-table th,.scorecards-grid.print-4 .score-table td{font-size:7px}
.scorecards-grid.print-4 .score-table tr{height:7.2mm}
.scorecards-grid.print-4 .scorecard-total{font-size:9px}
.scorecards-grid.print-4 .scorecard-foot{font-size:6px}

@page{size:A3 landscape;margin:6mm}
}

.tv-mode{background:#020617;color:#f8fafc;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.tv-wrap{min-height:100vh;padding:32px 42px}.tv-head{display:flex;justify-content:space-between;align-items:end;border-bottom:3px solid #38bdf8;padding-bottom:16px;margin-bottom:24px}.tv-head h1{font-size:42px;margin:0}.tv-head .sub{font-size:20px;color:#bae6fd}.tv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.tv-card{background:#0f172a;border:1px solid #334155;border-radius:18px;padding:22px}.tv-card h2{font-size:30px;margin:0 0 14px}.tv-table{width:100%;border-collapse:collapse;min-width:0;background:transparent}.tv-table th,.tv-table td{border-bottom:1px solid #334155;padding:11px 10px;font-size:22px;color:#f8fafc}.tv-table th{background:#1e293b;font-size:16px;color:#bae6fd}.tv-score{font-size:34px;font-weight:900}.tv-muted{color:#94a3b8}.tv-footer{position:fixed;left:42px;right:42px;bottom:18px;display:flex;justify-content:space-between;color:#94a3b8;font-size:15px}.tv-big-list{display:grid;gap:12px}.tv-match{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;background:#0f172a;border:1px solid #334155;border-radius:16px;padding:18px 20px;font-size:28px}.tv-match .right{text-align:right}.tv-match .score{font-size:36px;font-weight:900;color:#7dd3fc}.tv-empty{text-align:center;font-size:30px;color:#94a3b8;padding:70px 20px}.tv-controls{display:flex;gap:10px;align-items:center}.tv-controls button{border:1px solid #475569;background:#0f172a;color:#fff;padding:9px 13px;border-radius:10px;font-size:14px}@media(max-width:900px){.tv-wrap{padding:22px}.tv-head h1{font-size:30px}.tv-grid{grid-template-columns:1fr}.tv-table th,.tv-table td{font-size:18px}.tv-match{font-size:22px}.tv-footer{left:22px;right:22px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="ball"></div><div><h1>One Stop Bowling Software</h1><small id="subtitle">Live tournament management</small></div></div>
  <div class="rolebar"><button data-role="public" class="active">Public View</button><button data-role="scorer">Scorer</button><button data-role="admin">Admin</button><button id="accountBtn">Sign in</button></div>
</header>
<main class="wrap">
  <div class="notice" id="syncNotice">Offline mode: tournaments and scores are saved on this device. Use Backup regularly to save a copy you can restore on another device.</div>
  <div class="toolbar">
    <select id="competitionSelect" class="grow"></select>
    <button class="btn secondary" id="exportBtn">Backup</button>
    <label class="btn secondary" style="cursor:pointer">Restore<input id="importFile" type="file" accept="application/json" hidden></label>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <section id="screen"></section>
</main>
<nav class="bottom" id="bottomNav"></nav>
<div class="modal hidden" id="authModal"><div class="modalbox"><h3 id="authTitle">Sign in</h3><p class="muted" id="authText">Admin and scorers use their own account.</p><input id="authName" class="auth-input" style="text-align:left;letter-spacing:0;font-size:16px" placeholder="Your name (new accounts)"><input id="authEmail" class="auth-input" style="text-align:left;letter-spacing:0;font-size:16px" type="email" autocomplete="email" placeholder="Email address"><input id="authPassword" class="auth-input" style="text-align:left;letter-spacing:0;font-size:16px" type="password" autocomplete="current-password" placeholder="Password"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary" style="flex:1" id="authCancel">Cancel</button><button class="btn secondary" style="flex:1" id="authSignup">Create account</button><button class="btn primary" style="flex:1" id="authSignin">Sign in</button></div><p id="authError" style="color:#b91c1c"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://oexgvfbgxtcxhnmscuob.supabase.co';
const SUPABASE_KEY='sb_publishable_Q9GQwbevHNobyIiQ5XC76w_PvJZSJuY';
const LIVE_STATE_ID='demo';
const APP_VERSION='2026.09.04.4';
let cloud=null,cloudReady=false,cloudApplying=false,cloudChannel=null,currentUser=null,currentAppRole='public',authRequestedRole=null;
const APPKEY='bowlsTournamentProOfflineV2';
const defaultComp=()=>({
 id:'comp-'+Date.now(),title:'Bowls Competition',created:new Date().toISOString(),
 settings:{clubName:'Your Bowls Club',tournamentType:'standard',scoringMode:'final',aggregateSideA:'District A',aggregateSideB:'District B',aggregateRinks:6,gameType:'rinks',drawMethod:'auto',manualGroups:4,teamCount:16,groupSize:4,rinks:4,ends:12,start:'09:00',minutes:80,knockoutMinutes:80,targetFinish:'21:00',eventFormat:'same_day',day1TargetFinish:'21:00',day2Start:'09:00',winPts:2,drawPts:1,qualify:'winner_best_runner',bestRunners:4,optimise:'balanced'},
 pins:{admin:'0001',scorer:'0001'},teams:Array.from({length:16},(_,i)=>({id:'t'+(i+1),name:'Team '+(i+1),group:'',players:{}})),fixtures:[],knockout:[],drawSeed:1
});
let db=loadDB();let role='public', tab='dashboard';
function loadDB(){try{let x=JSON.parse(localStorage.getItem(APPKEY));if(x&&x.competitions?.length)return x}catch(e){}return {competitions:[defaultComp()],active:null}}
function canWriteCloud(){return !!currentUser&&['owner','admin','scorer'].includes(currentAppRole)}
function saveDB(){localStorage.setItem(APPKEY,JSON.stringify(db));if(cloudReady&&!cloudApplying&&canWriteCloud())pushCloudState();}
function isArchived(c=comp()){return !!c.archivedAt}
function safeFileName(v){return String(v||'competition').trim().replace(/[^a-z0-9-_]+/gi,'-').replace(/^-+|-+$/g,'')||'competition'}
function downloadBlobFile(content,type,name){let blob=new Blob([content],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function downloadCompetitionBackup(c=comp()){
 let pack={competitions:[JSON.parse(JSON.stringify(c))],active:c.id,archiveExport:{app:'One Stop Bowling Software',exportedAt:new Date().toISOString()}};
 downloadBlobFile(JSON.stringify(pack,null,2),'application/json',safeFileName(c.title||'competition')+'-archive-backup.json');
}
function competitionSummaryHTML(c=comp()){
 let title=esc((c.title||'').trim()||'Untitled competition'),type=c.settings?.tournamentType||'standard',body='';
 if(type==='aggregate'){
  let t=aggregateTotals(c),rows=ensureAggregate(c);
  body=`<h2>${esc(c.settings.aggregateSideA||'Side A')} ${t.a} – ${t.b} ${esc(c.settings.aggregateSideB||'Side B')}</h2><table><tr><th>Rink</th><th>Side A / Skip</th><th>Score</th><th>Side B / Skip</th></tr>${rows.map(r=>{let s=currentScore(r);return `<tr><td>${r.rink}</td><td>${esc(r.skipA||'')}</td><td>${s.a} – ${s.b}</td><td>${esc(r.skipB||'')}</td></tr>`}).join('')}</table>`;
 }else if(type==='knockout'){
  body=(c.knockout||[]).map(round=>`<h2>${esc(round[0]?.roundName||'Knockout')}</h2><table><tr><th>Team A</th><th>Score</th><th>Team B</th></tr>${round.map(m=>`<tr><td>${esc(knockoutRefName(m.a,c))}</td><td>${completed(m)?`${m.scoreA} – ${m.scoreB}`:'—'}</td><td>${esc(knockoutRefName(m.b,c))}</td></tr>`).join('')}</table>`).join('');
 }else{
  let st=standings(c);
  body=Object.keys(st).sort().map(g=>`<h2>Group ${esc(g)}</h2><table><tr><th>Pos</th><th>Team</th><th>P</th><th>SF</th><th>SA</th><th>SD</th><th>Pts</th></tr>${st[g].map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.p}</td><td>${r.sf}</td><td>${r.sa}</td><td>${r.sd}</td><td>${r.pts}</td></tr>`).join('')}</table>`).join('');
  body+=`<h2>Results</h2><table><tr><th>Game</th><th>Team A</th><th>Score</th><th>Team B</th></tr>${(c.fixtures||[]).map(f=>`<tr><td>${f.game||''}</td><td>${esc(fixtureTeamName(f,'a',c))}</td><td>${completed(f)?`${f.scoreA} – ${f.scoreB}`:'—'}</td><td>${esc(fixtureTeamName(f,'b',c))}</td></tr>`).join('')}</table>`;
 }
 return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title}</title><style>body{font-family:Arial,sans-serif;margin:28px;color:#111}h1{margin-bottom:4px}.muted{color:#666}table{width:100%;border-collapse:collapse;margin:10px 0 24px}th,td{border:1px solid #bbb;padding:7px;text-align:left}th{background:#eee}@media print{@page{size:A4;margin:12mm}}</style></head><body><h1>${title}</h1><p class="muted">Archived ${c.archivedAt?new Date(c.archivedAt).toLocaleString():''} • One Stop Bowling Software</p>${body}</body></html>`;
}
function downloadResultsSummary(c=comp()){downloadBlobFile(competitionSummaryHTML(c),'text/html',safeFileName(c.title||'competition')+'-results-summary.html')}
async function completeAndArchive(){
 let c=comp();if(isArchived(c)){alert('This competition is already archived.');return}
 if(!confirm('Complete and archive this competition? It will be locked against further scoring changes.'))return;
 c.archivedAt=new Date().toISOString();c.status='archived';saveDB();
 await auditEvent('competition_archived',(c.title||'Untitled competition'),null,{archivedAt:c.archivedAt});
 downloadCompetitionBackup(c);
 if(confirm('Competition archived and a full backup has been downloaded. Start a new competition now?')){
  let n=defaultComp();n.title='';db.competitions.push(n);db.active=n.id;saveDB();tab='builder';render()
 }else render()
}

async function pushCloudState(){
 try{
  let {error}=await cloud.from('bowls_live_state').upsert({id:LIVE_STATE_ID,state:db,updated_at:new Date().toISOString()},{onConflict:'id'});
  if(error)throw error;setSyncNotice('Live sync connected • changes shared with all devices • Build '+APP_VERSION,true);
 }catch(e){console.error('Cloud save failed',e);setSyncNotice('Live sync temporarily unavailable • changes are still saved on this device',false)}
}
function setSyncNotice(msg,ok){let el=document.getElementById('syncNotice');if(!el)return;el.textContent=msg;el.classList.toggle('oknotice',!!ok)}
function updateAccountButton(){let b=document.getElementById('accountBtn');if(!b)return;b.textContent=currentUser?(currentUser.email||'Account'):'Sign in';b.title=currentUser?`${currentAppRole} account • tap to sign out`:'Sign in / create account'}
async function loadCurrentProfile(){
 if(!cloud||!currentUser){currentAppRole='public';updateAccountButton();return}
 let {data,error}=await cloud.from('bowls_users').select('role,display_name,email').eq('user_id',currentUser.id).maybeSingle();
 if(error){console.error('Profile load failed',error);currentAppRole='pending'}else currentAppRole=data?.role||'pending';
 updateAccountButton();
}
function roleAllowed(target){if(target==='public')return true;if(target==='scorer')return ['owner','admin','scorer'].includes(currentAppRole);if(target==='admin')return ['owner','admin'].includes(currentAppRole);return false}

async function initCloudSync(){

  if(!window.supabase?.createClient)throw new Error('Supabase library did not load');

  setSyncNotice('Connecting live sync…',false);
  let {data,error}=await cloud.from('bowls_live_state').select('state,updated_at').eq('id',LIVE_STATE_ID).maybeSingle();
  if(error)throw error;
  if(data?.state?.competitions?.length){cloudApplying=true;db=data.state;localStorage.setItem(APPKEY,JSON.stringify(db));cloudApplying=false;render()}
  else {cloudReady=true;await pushCloudState()}
  cloudReady=true;setSyncNotice('Live sync connected • changes shared with all devices • Build '+APP_VERSION,true);
  cloudChannel=cloud.channel('bowls-live-demo').on('postgres_changes',{event:'UPDATE',schema:'public',table:'bowls_live_state',filter:`id=eq.${LIVE_STATE_ID}`},payload=>{
   let next=payload.new?.state;if(!next?.competitions?.length)return;
   // Ignore our own echoed update so the scoring form does not jump/re-render while typing.
   if(JSON.stringify(next)===JSON.stringify(db)){setSyncNotice('Live sync connected • changes shared with all devices • Build '+APP_VERSION,true);return}
   cloudApplying=true;db=next;localStorage.setItem(APPKEY,JSON.stringify(db));cloudApplying=false;render();setSyncNotice('Live sync connected • latest changes received',true);
  }).subscribe(status=>{if(status==='SUBSCRIBED')setSyncNotice('Live sync connected • changes shared with all devices • Build '+APP_VERSION,true)});
 }catch(e){console.error('Cloud sync failed',e);cloudReady=false;setSyncNotice('Offline mode • live sync could not connect, but this device will keep saving locally',false)}
}

function standings(c=comp()){
 let out={};c.teams.forEach(t=>out[t.group]??=[]);c.teams.forEach(t=>{if(t.group)out[t.group].push({id:t.id,name:t.name,p:0,w:0,d:0,l:0,sf:0,sa:0,sd:0,pts:0})});

 Object.values(out).forEach(rows=>rows.forEach(r=>r.sd=r.sf-r.sa));Object.values(out).forEach(rows=>rows.sort((a,b)=>b.pts-a.pts||b.sd-a.sd||b.sf-a.sf||a.name.localeCompare(b.name)));return out

function pickFullestSession(pending,rinks,prevTeams=new Set()){

   let ub=(prevTeams.has(u.a.id)?1:0)+(prevTeams.has(u.b.id)?1:0),vb=(prevTeams.has(v.a.id)?1:0)+(prevTeams.has(v.b.id)?1:0);

 winners.slice(0,byeCount).forEach(w=>{matches.push({a:w.id,b:null,scoreA:'',scoreB:'',sameGroupRematch:false,groupA:w.group,groupB:null});used.add(w.id)});
 let remainingWinners=winners.filter(w=>!used.has(w.id));
 // Prefer winner v qualifier from another group.
 remainingWinners.forEach(w=>{let pool=others.filter(o=>!used.has(o.id)),opp=pool.find(o=>o.group!==w.group)||pool[0];if(opp){matches.push({a:w.id,b:opp.id,scoreA:'',scoreB:'',sameGroupRematch:opp.group===w.group,groupA:w.group,groupB:opp.group});used.add(w.id);used.add(opp.id)}});
 let left=ranked.filter(x=>!used.has(x.id));
 // Pair remaining qualifiers, again avoiding same-group meetings wherever possible.
 while(left.length>1){let a=left.shift(),idx=left.findIndex(b=>b.group!==a.group);if(idx<0)idx=0;let b=left.splice(idx,1)[0];matches.push({a:a.id,b:b.id,scoreA:'',scoreB:'',sameGroupRematch:a.group===b.group,groupA:a.group,groupB:b.group});used.add(a.id);used.add(b.id)}
 if(left.length){let a=left.shift();matches.push({a:a.id,b:null,scoreA:'',scoreB:'',sameGroupRematch:false,groupA:a.group,groupB:null})}
 while(matches.length<size/2)matches.push({a:null,b:null,scoreA:'',scoreB:'',sameGroupRematch:false,groupA:null,groupB:null});
 return matches;
}
function generateKnockout(){let c=comp(),q=qualifiers();if(q.length<2){alert('Not enough qualifiers yet.');return}let matches=buildKnockoutFirstRound(q);c.knockout=[matches];saveDB();render()}
function renderKnockout(s){let c=comp();if((c.settings.tournamentType||'standard')==='knockout'){let kp=c.knockoutOnlyPlan||knockoutOnlyPlan(c.teams.length,c.settings.rinks,c.settings.knockoutMinutes||c.settings.minutes,c.settings.start);s.innerHTML=`<div class="card"><h2>Knockout Format</h2><div class="grid"><div class="kpi"><b>${c.teams.length}</b><span>Teams</span></div><div class="kpi"><b>${kp.prelimGames}</b><span>Prelim games</span></div><div class="kpi"><b>${kp.byes}</b><span>Byes</span></div><div class="kpi"><b>${kp.finalFinish}</b><span>Est. final</span></div></div>${!c.knockout?.length&&role==='admin'?'<button class="btn primary" id="genKoOnly2" style="margin-top:12px">Generate Knockout Draw</button>':''}</div>${c.knockout?.length?`<div class="bracket">${c.knockout.map((round,ri)=>`<div class="round"><h3>${esc(round[0]?.roundName||('Round '+(ri+1)))}</h3>${round.map(m=>`<div class="match"><div>${esc(knockoutRefName(m.a,c))}</div><div>${esc(knockoutRefName(m.b,c))}</div></div>`).join('')}</div>`).join('')}</div>`:''}`;let b=document.getElementById('genKoOnly2');if(b)b.onclick=()=>{generateKnockoutOnlyDraw();render()};return}let q=qualifiers(),first=c.knockout[0]||[],rematches=first.filter(m=>m.a&&m.b&&m.sameGroupRematch).length;s.innerHTML=`<div class="card"><h2>Knockout</h2><p class="muted">Qualifiers are ranked by points, shot difference and shots for. The first knockout round keeps group winners apart from qualifiers from the same group wherever possible.</p><div>${q.map((x,i)=>`<span class="pill wait" style="margin:3px">${i+1}. ${esc(x.name)} <span class="qual">(${x.group}${x.pos})</span></span>`).join('')||'No qualifiers yet.'}</div>${role==='admin'?`<button class="btn primary" id="genKO" style="margin-top:12px">Generate Knockout</button>`:''}${c.knockout.length?`<div class="${rematches?'notice':'oknotice notice'}" style="margin-top:12px"><b>First-round group protection:</b> ${rematches?`${rematches} same-group rematch${rematches===1?'':'es'} could not be avoided with this qualifier combination.`:'No same-group rematches in the first knockout round.'}</div>`:''}</div>${c.knockout.length?`<div class="card"><div class="bracket">${c.knockout.map((round,ri)=>`<div class="round"><h3>${ri===c.knockout.length-1&&round.length===1?'Final':ri===0?'First Round':'Round '+(ri+1)}</h3>${round.map((m,mi)=>`<div class="match"><div>${esc(m.a?teamName(m.a):'BYE')}</div><div>${esc(m.b?teamName(m.b):'BYE')}</div>${ri===0&&m.sameGroupRematch?'<div class="qual" style="color:#b45309;font-weight:700">⚠ Same-group rematch unavoidable</div>':''}</div>`).join('')}</div>`).join('')}</div></div>`:''}`;if(role==='admin'&&document.getElementById('genKO'))document.getElementById('genKO').onclick=generateKnockout}
function renderAdmin(s){let c=comp();if(!['owner','admin'].includes(currentAppRole)){s.innerHTML='<div class="card"><h2>Admin</h2><p>This account does not have Admin permission.</p></div>';return}
 let archiveCard=c.archivedAt?`<div class="card"><h2>Archived Competition</h2><div class="oknotice notice"><b>Completed:</b> ${new Date(c.archivedAt).toLocaleString()}</div><p class="muted">This event is locked against further scoring changes. It remains available from the competition list.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="downloadArchive">Download Full Backup</button><button class="btn secondary" id="downloadSummary">Download Results Summary</button><button class="btn success" id="newAfterArchive">Start New Competition</button></div></div>`:`<div class="card"><h2>Finish Competition</h2><p class="muted">When the event is finished, archive it before starting the next one. A full restore backup will download to your device and the competition will stay listed as Archived.</p><button class="btn success" id="completeArchive">Complete & Archive Competition</button></div>`;
 s.innerHTML=`${archiveCard}<div class="card"><h2>Accounts & Permissions</h2><p class="muted">Each scorer uses their own account. New accounts remain Pending until approved.</p><div id="userAdminList"><p class="muted">Loading accounts…</p></div></div><div class="card"><h2>Audit Trail</h2><p class="muted">Recent score changes, including who changed them and when.</p><div id="auditList"><p class="muted">Loading audit history…</p></div></div><div class="card"><h2>Competition Admin</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary" id="newComp">New Competition</button>${!c.archivedAt?'<button class="btn danger" id="resetComp">Reset Current Competition</button>':''}<button class="btn secondary" id="signOutAdmin">Sign out</button></div></div>`;
 let ca=document.getElementById('completeArchive');if(ca)ca.onclick=completeAndArchive;
 let da=document.getElementById('downloadArchive');if(da)da.onclick=()=>downloadCompetitionBackup(c);
 let ds=document.getElementById('downloadSummary');if(ds)ds.onclick=()=>downloadResultsSummary(c);
 let na=document.getElementById('newAfterArchive');if(na)na.onclick=()=>{let n=defaultComp();n.title='';db.competitions.push(n);db.active=n.id;saveDB();tab='builder';render()};
 document.getElementById('newComp').onclick=()=>{if(!c.archivedAt&&!confirm('Start a new competition without archiving the current one first?'))return;let n=defaultComp();n.title='';db.competitions.push(n);db.active=n.id;saveDB();tab='builder';render()};
 let reset=document.getElementById('resetComp');if(reset)reset.onclick=()=>{if(confirm('Reset this competition? Scores, draw and fixtures will be cleared.')){c.fixtures=[];c.knockout=[];c.teams.forEach((t,i)=>{t.group='';t.name='Team '+(i+1);t.players={}});saveDB();render()}};
 document.getElementById('signOutAdmin').onclick=signOutAccount;loadAdminExtras()}
async function loadAdminExtras(){
 if(!cloud||!['owner','admin'].includes(currentAppRole))return;
 let usersBox=document.getElementById('userAdminList'),auditBox=document.getElementById('auditList');
 let {data:users,error:uerr}=await cloud.from('bowls_users').select('user_id,email,display_name,role,created_at').order('created_at',{ascending:true});
 if(usersBox){if(uerr)usersBox.innerHTML='<p>Could not load accounts.</p>';else usersBox.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>${(users||[]).map(u=>`<tr><td>${esc(u.display_name||'')}</td><td>${esc(u.email||'')}</td><td>${u.role==='owner'?'<b>Owner</b>':`<select data-user-role="${u.user_id}"><option value="pending" ${u.role==='pending'?'selected':''}>Pending</option><option value="scorer" ${u.role==='scorer'?'selected':''}>Scorer</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select>`}</td></tr>`).join('')}</tbody></table></div>`;usersBox.querySelectorAll('[data-user-role]').forEach(sel=>sel.onchange=async()=>{let {error}=await cloud.from('bowls_users').update({role:sel.value,updated_at:new Date().toISOString()}).eq('user_id',sel.dataset.userRole);if(error){alert(error.message);loadAdminExtras()}else{await auditEvent('permission_change','User '+sel.dataset.userRole,null,{role:sel.value});loadAdminExtras()}})}
 let {data:logs,error:lerr}=await cloud.from('bowls_audit_log').select('id,user_email,user_role,action,target,old_value,new_value,created_at').eq('competition_id',comp().id).order('created_at',{ascending:false}).limit(100);
 if(auditBox){if(lerr)auditBox.innerHTML='<p>Could not load audit history.</p>';else if(!logs?.length)auditBox.innerHTML='<p class="muted">No score changes have been logged yet.</p>';else auditBox.innerHTML=`<div class="tablewrap"><table><thead><tr><th>When</th><th>User</th><th>Action</th><th>Target</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${new Date(l.created_at).toLocaleString()}</td><td>${esc(l.user_email||'Unknown')}<div class="meta">${esc(l.user_role||'')}</div></td><td>${esc((l.action||'').replaceAll('_',' '))}</td><td>${esc(l.target||'')}</td></tr>`).join('')}</tbody></table></div>`}
}

function setQueryRole(r){try{let u=new URL(location.href);u.searchParams.set('view',r);history.replaceState({},'',u)}catch(e){}}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>requestRole(b.dataset.role));
document.getElementById('authCancel').onclick=()=>document.getElementById('authModal').classList.add('hidden');
document.getElementById('authSignin').onclick=signInAccount;document.getElementById('authSignup').onclick=createAccount;
document.getElementById('authPassword').onkeydown=e=>{if(e.key==='Enter')signInAccount()};
document.getElementById('accountBtn').onclick=()=>{if(currentUser){if(confirm(`Signed in as ${currentUser.email}. Sign out?`))signOutAccount()}else showAuthModal('scorer')};
document.getElementById('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bowls-tournament-backup.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.competitions)throw 0;db=x;saveDB();render()}catch{alert('That backup file could not be read.')}};r.readAsText(f)};
function tvCurrentGames(c){let fs=c.fixtures||[],pending=fs.filter(f=>!completed(f));if(!fs.length)return[];let currentSession=pending.length?Math.min(...pending.map(f=>f.session)):Math.max(...fs.map(f=>f.session));return fs.filter(f=>f.session===currentSession)}
function tvUpcoming(c){let fs=(c.fixtures||[]).filter(f=>!completed(f));if(!fs.length)return[];let sessions=[...new Set(fs.map(f=>f.session))].sort((a,b)=>a-b);let n=sessions[0];return fs.filter(f=>f.session===n).slice(0,12)}
function tvTableHTML(c){let st=standings(c),keys=Object.keys(st).sort();if(!keys.length)return '<div class="tv-empty">Group tables will appear after the draw.</div>';return `<div class="tv-grid">${keys.map(g=>`<div class="tv-card"><h2>Group ${g}</h2><table class="tv-table"><thead><tr><th>Pos</th><th>Team</th><th>P</th><th>SD</th><th>Pts</th></tr></thead><tbody>${st[g].map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.name)}</b></td><td>${r.p}</td><td>${r.sd>0?'+':''}${r.sd}</td><td><b>${r.pts}</b></td></tr>`).join('')}</tbody></table></div>`).join('')}</div>`}
function tvMatchesHTML(rows,title,empty){if(!rows.length)return `<div class="tv-empty">${empty}</div>`;return `<div class="tv-card"><h2>${title}</h2><div class="tv-big-list">${rows.map(f=>`<div class="tv-match"><div><b>${esc(fixtureTeamName(f,'a'))}</b><div class="tv-muted" style="font-size:16px">Group ${esc(f.group)} • Rink ${f.rink}</div></div><div class="score">${completed(f)?`${f.scoreA} – ${f.scoreB}`:'vs'}</div><div class="right"><b>${esc(fixtureTeamName(f,'b'))}</b><div class="tv-muted" style="font-size:16px">${f.start} • Game ${f.game}</div></div></div>`).join('')}</div></div>`}
function tvFinalsHTML(c){if(!c.knockout?.length)return '<div class="tv-empty">Knockout / finals will appear here when generated.</div>';return `<div class="tv-grid">${c.knockout.map((round,ri)=>`<div class="tv-card"><h2>${ri===c.knockout.length-1&&round.length===1?'Final':ri===0?'First Round':'Round '+(ri+1)}</h2>${round.map(m=>`<div class="tv-match" style="grid-template-columns:1fr auto 1fr;margin-bottom:12px"><div><b>${esc(m.a?teamName(m.a,c):'BYE')}</b></div><div class="score">vs</div><div class="right"><b>${esc(m.b?teamName(m.b,c):'BYE')}</b></div></div>`).join('')}</div>`).join('')}</div>`}
let tvPage=0,tvTimer=null,tvPaused=false;
function renderTv(){let c=comp(),pages=['Live / Current Games','Group Tables','Upcoming Fixtures','Finals'],title=pages[tvPage%pages.length],body='';if(tvPage%4===0)body=tvMatchesHTML(tvCurrentGames(c),'Current Session','No games have been scheduled yet.');if(tvPage%4===1)body=tvTableHTML(c);if(tvPage%4===2)body=tvMatchesHTML(tvUpcoming(c),'Upcoming Fixtures','No upcoming fixtures.');if(tvPage%4===3)body=tvFinalsHTML(c);document.body.className='tv-mode';document.body.innerHTML=`<div class="tv-wrap"><div class="tv-head"><div><h1>${esc(c.title)}</h1><div class="sub">${esc(c.settings.clubName||'')} • ${title}</div></div><div class="tv-controls"><button id="tvPrev">◀</button><button id="tvPause">${tvPaused?'Resume':'Pause'}</button><button id="tvNext">▶</button><button id="tvFull">Full Screen</button></div></div>${body}<div class="tv-footer"><span>One Stop Bowling Software • TV Display</span><span>Updates automatically • Screen ${tvPage%4+1}/4</span></div></div>`;document.getElementById('tvPrev').onclick=()=>{tvPage=(tvPage+3)%4;renderTv()};document.getElementById('tvNext').onclick=()=>{tvPage=(tvPage+1)%4;renderTv()};document.getElementById('tvPause').onclick=()=>{tvPaused=!tvPaused;renderTv()};document.getElementById('tvFull').onclick=()=>document.documentElement.requestFullscreen?.();}
function startTv(){renderTv();tvTimer=setInterval(()=>{try{db=loadDB()}catch(e){}if(!tvPaused){tvPage=(tvPage+1)%4;renderTv()}else renderTv()},10000);window.addEventListener('storage',()=>{db=loadDB();renderTv()});}
let params=new URLSearchParams(location.search);if(params.get('tv')==='1'){startTv();initCloudSync()}else{let initial=params.get('view');render();initCloudSync().then(()=>{if(initial==='scorer'||initial==='admin')requestRole(initial)});}
