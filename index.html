<style>

button,input,select{font:inherit}.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#082f49,#075985);color:#fff;padding:14px 14px 10px;box-shadow:0 2px 12px #0002}.brand{display:flex;align-items:center;gap:10px}.ball{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#dbeafe 18%,#1e3a8a 20%,#082f49 72%);border:2px solid #fff8;box-shadow:inset -4px -5px 10px #0005}.brand h1{font-size:18px;margin:0}.brand small{display:block;color:#bae6fd;margin-top:2px}.rolebar{display:flex;gap:7px;margin-top:12px;overflow:auto;padding-bottom:2px}.rolebar button{white-space:nowrap;background:#ffffff18;border:1px solid #ffffff35;color:white;padding:8px 11px;border-radius:999px}.rolebar button.active{background:#fff;color:var(--nav);font-weight:700}
.wrap{max-width:1100px;margin:0 auto;padding:14px 14px 90px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar select,.toolbar input{background:#fff;border:1px solid var(--line);padding:9px 10px;border-radius:10px}.grow{flex:1}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#e2e8f0;color:#0f172a}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px;box-shadow:0 3px 12px #0f172a08}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow:auto;padding:2px 0 10px}.tabs button{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px;white-space:nowrap}.tabs button.active{background:var(--nav);color:#fff;border-color:var(--nav)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:650px;background:#fff}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{background:#f1f5f9;font-size:12px;text-transform:uppercase;letter-spacing:.03em}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.pill.done{background:#dcfce7;color:#166534}.pill.wait{background:#fef3c7;color:#92400e}.scoreline{display:grid;grid-template-columns:1fr 58px 22px 58px 1fr;gap:7px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.scoreline:last-child{border-bottom:0}.scoreline input{width:58px;text-align:center;padding:10px 5px;border:1px solid #cbd5e1;border-radius:9px;font-size:18px;font-weight:800}.scoreline .away{text-align:right}.meta{font-size:12px;color:var(--muted);margin-top:3px}.groupgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.groupbox h3{background:var(--nav);color:#fff;padding:9px 11px;border-radius:10px 10px 0 0;margin:0}.groupbox .tablewrap{border-radius:0 0 10px 10px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:700}.field input,.field select{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px;background:#fff}.teamrow{display:flex;gap:8px;margin-bottom:7px}.teamrow span{width:34px;color:var(--muted);padding-top:10px}.teamrow input{flex:1;border:1px solid #cbd5e1;border-radius:9px;padding:9px}.teamcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}.teamhead{display:grid;grid-template-columns:36px 1fr 44px;gap:8px;align-items:center}.teamplayers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.teamplayers label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px}.teamplayers input{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px}.notice{padding:10px 12px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;margin-bottom:12px}.oknotice{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}.hidden{display:none!important}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:none;z-index:20;padding-bottom:env(safe-area-inset-bottom)}.bottom button{flex:1;border:0;background:#fff;padding:10px 4px;font-size:11px;color:#475569}.bottom button.active{color:var(--blue);font-weight:800}.bottom b{display:block;font-size:18px;margin-bottom:2px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}.modalbox{background:#fff;border-radius:16px;padding:18px;width:min(390px,100%)}.modalbox input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:22px;text-align:center;letter-spacing:5px;margin:8px 0 12px}.bracket{display:grid;grid-template-columns:repeat(3,minmax(210px,1fr));gap:16px;overflow:auto}.round{min-width:210px}.match{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff;overflow:hidden}.match div{padding:8px 10px;border-bottom:1px solid var(--line)}.match div:last-child{border-bottom:0}.qual{font-size:12px;color:var(--muted)}

@media print{
header,.toolbar,.tabs,.bottom,.noPrint,#syncNotice{display:none!important}
.wrap{max-width:none;padding:0}
.scorecards-grid{display:grid!important;gap:3mm}
.scorecard{border-radius:0;min-height:0;break-inside:avoid;page-break-inside:avoid}
.scorecard-title{font-weight:800}
.scorecard-info{line-height:1.15}
.score-table th,.score-table td{height:auto;min-height:0}
.scorecard-foot{line-height:1.1}

/* 8 per A3: 4 across x 2 rows */
.scorecards-grid.print-8{grid-template-columns:repeat(4,1fr)}
.scorecards-grid.print-8 .scorecard{height:137mm;padding:2mm}
.scorecards-grid.print-8 .scorecard-title{font-size:9px;padding:2px;margin-bottom:2px}
.scorecards-grid.print-8 .scorecard-info{font-size:6px;gap:2px 5px;margin-bottom:2px}
.scorecards-grid.print-8 .scorecard-info div{min-height:12px}
.scorecards-grid.print-8 .scorecard-vs{font-size:8px;padding:2px 0;margin-bottom:1px}
.scorecards-grid.print-8 .player-lines>div{font-size:6px;min-height:12px;padding:1px 3px}
.scorecards-grid.print-8 .score-table th,.scorecards-grid.print-8 .score-table td{font-size:5.5px}
.scorecards-grid.print-8 .score-table tr{height:4.6mm}
.scorecards-grid.print-8 .scorecard-total{font-size:7px;margin-top:2px}
.scorecards-grid.print-8 .scorecard-total div{padding:2px}
.scorecards-grid.print-8 .scorecard-foot{font-size:4.5px;margin-top:2px}

/* 6 per A3: 3 across x 2 rows */
.scorecards-grid.print-6{grid-template-columns:repeat(3,1fr)}
.scorecards-grid.print-6 .scorecard{height:137mm;padding:2.4mm}
.scorecards-grid.print-6 .scorecard-title{font-size:10px;padding:2px;margin-bottom:2px}
.scorecards-grid.print-6 .scorecard-info{font-size:6.8px;gap:2px 6px;margin-bottom:2px}
.scorecards-grid.print-6 .scorecard-info div{min-height:13px}
.scorecards-grid.print-6 .scorecard-vs{font-size:9px;padding:2px 0;margin-bottom:1px}
.scorecards-grid.print-6 .player-lines>div{font-size:6.5px;min-height:13px;padding:1px 3px}
.scorecards-grid.print-6 .score-table th,.scorecards-grid.print-6 .score-table td{font-size:6px}
.scorecards-grid.print-6 .score-table tr{height:5mm}
.scorecards-grid.print-6 .scorecard-total{font-size:7.5px;margin-top:2px}
.scorecards-grid.print-6 .scorecard-total div{padding:2px}
.scorecards-grid.print-6 .scorecard-foot{font-size:5px;margin-top:2px}

/* 4 per A3 for longer games */
.scorecards-grid.print-4{grid-template-columns:repeat(4,1fr)}
.scorecards-grid.print-4 .scorecard{height:278mm;padding:3mm}
.scorecards-grid.print-4 .scorecard-title{font-size:12px}
.scorecards-grid.print-4 .scorecard-info{font-size:8px}
.scorecards-grid.print-4 .player-lines>div{font-size:8px;min-height:17px}
.scorecards-grid.print-4 .score-table th,.scorecards-grid.print-4 .score-table td{font-size:7px}
.scorecards-grid.print-4 .score-table tr{height:7.2mm}
.scorecards-grid.print-4 .scorecard-total{font-size:9px}
.scorecards-grid.print-4 .scorecard-foot{font-size:6px}

@page{size:A3 landscape;margin:6mm}
}

.tv-mode{background:#020617;color:#f8fafc;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.tv-wrap{min-height:100vh;padding:32px 42px}.tv-head{display:flex;justify-content:space-between;align-items:end;border-bottom:3px solid #38bdf8;padding-bottom:16px;margin-bottom:24px}.tv-head h1{font-size:42px;margin:0}.tv-head .sub{font-size:20px;color:#bae6fd}.tv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.tv-card{background:#0f172a;border:1px solid #334155;border-radius:18px;padding:22px}.tv-card h2{font-size:30px;margin:0 0 14px}.tv-table{width:100%;border-collapse:collapse;min-width:0;background:transparent}.tv-table th,.tv-table td{border-bottom:1px solid #334155;padding:11px 10px;font-size:22px;color:#f8fafc}.tv-table th{background:#1e293b;font-size:16px;color:#bae6fd}.tv-score{font-size:34px;font-weight:900}.tv-muted{color:#94a3b8}.tv-footer{position:fixed;left:42px;right:42px;bottom:18px;display:flex;justify-content:space-between;color:#94a3b8;font-size:15px}.tv-big-list{display:grid;gap:12px}.tv-match{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;background:#0f172a;border:1px solid #334155;border-radius:16px;padding:18px 20px;font-size:28px}.tv-match .right{text-align:right}.tv-match .score{font-size:36px;font-weight:900;color:#7dd3fc}.tv-empty{text-align:center;font-size:30px;color:#94a3b8;padding:70px 20px}.tv-controls{display:flex;gap:10px;align-items:center}.tv-controls button{border:1px solid #475569;background:#0f172a;color:#fff;padding:9px 13px;border-radius:10px;font-size:14px}@media(max-width:900px){.tv-wrap{padding:22px}.tv-head h1{font-size:30px}.tv-grid{grid-template-columns:1fr}.tv-table th,.tv-table td{font-size:18px}.tv-match{font-size:22px}.tv-footer{left:22px;right:22px}}

.draw-share-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
@media print{
 body.printing-draw header,
 body.printing-draw .toolbar,
 body.printing-draw .tabs,
 body.printing-draw .bottom,
 body.printing-draw #syncNotice,
 body.printing-draw .draw-share-actions{display:none!important}
 body.printing-draw .wrap{max-width:none;padding:0}
 body.printing-draw #screen{display:block!important}
 body.printing-draw #screen .card{box-shadow:none}
 body.printing-draw .bracket{overflow:visible!important}
 body.printing-draw .groupgrid{grid-template-columns:repeat(2,1fr)!important}
 @page{size:A4 landscape;margin:10mm}
}

</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="ball"></div><div><h1>One Stop Bowling Software</h1><small id="subtitle">Live tournament management</small></div></div>
  <div class="rolebar"><button data-role="public" class="active">Public View</button><button data-role="scorer">Scorer</button><button data-role="admin">Admin</button><button id="accountBtn">Sign in</button></div>
</header>
<main class="wrap">
  <div class="notice" id="syncNotice">Offline mode: tournaments and scores are saved on this device. Use Backup regularly to save a copy you can restore on another device.</div>
  <div class="toolbar">
    <select id="competitionSelect" class="grow"></select>
    <button class="btn primary" id="newTournamentBtn">+ New Tournament</button>
    <button class="btn secondary" id="myTournamentsBtn">My Tournaments</button>
    <button class="btn secondary" id="accessBtn">Invite / Access</button>
    <button class="btn secondary" id="openCodeBtn">Open Code</button>
    <button class="btn secondary" id="shareTournamentBtn">Share Tournament</button>
    <button class="btn secondary" id="exportBtn">Backup</button>
    <label class="btn secondary" style="cursor:pointer">Restore<input id="importFile" type="file" accept="application/json" hidden></label>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <section id="screen"></section>
</main>
<nav class="bottom" id="bottomNav"></nav>
<div class="modal hidden" id="authModal"><div class="modalbox">
<h3 id="authTitle">Sign in</h3>
<p class="muted" id="authText">Sign in to manage or score tournaments.</p>
<div id="authModeTabs" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
<button class="btn primary" id="authModeSignin">Sign in</button>
<button class="btn secondary" id="authModeSignup">Create account</button>
</div>
<input id="authName" class="auth-input hidden" style="text-align:left;letter-spacing:0;font-size:16px" placeholder="Your name">
<input id="authEmail" class="auth-input" style="text-align:left;letter-spacing:0;font-size:16px" type="email" autocomplete="email" placeholder="Email address">
<input id="authPassword" class="auth-input" style="text-align:left;letter-spacing:0;font-size:16px" type="password" autocomplete="current-password" placeholder="Password">
<input id="authPassword2" class="auth-input hidden" style="text-align:left;letter-spacing:0;font-size:16px" type="password" autocomplete="new-password" placeholder="Confirm password">
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn secondary" style="flex:1" id="authCancel">Cancel</button>
<button class="btn primary" style="flex:2" id="authSubmit">Sign in</button>
</div>
<p id="authError" style="color:#b91c1c"></p>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const SUPABASE_URL='https://oexgvfbgxtcxhnmscuob.supabase.co';
const SUPABASE_KEY='sb_publishable_Q9GQwbevHNobyIiQ5XC76w_PvJZSJuY';
const LIVE_STATE_ID='demo';
const APP_VERSION='2026.09.04.28';
let cloud=null,cloudReady=false,cloudApplying=false,cloudChannel=null,currentUser=null,currentAppRole='public',currentAccess=null,authRequestedRole=null,authMode='signin',remoteRefreshTimer=null,remoteSaveBusy=false,remoteLastPushAt=0,remoteTournamentId=localStorage.getItem('bowlsRemoteTournamentId')||'',remoteTournamentCode=localStorage.getItem('bowlsRemoteTournamentCode')||'',remoteAccessRole=localStorage.getItem('bowlsRemoteAccessRole')||'';
const APPKEY='bowlsTournamentProOfflineV2';
const defaultComp=()=>({
 id:'comp-'+Date.now(),title:'Bowls Competition',created:new Date().toISOString(),
 settings:{clubName:'Your Bowls Club',tournamentType:'standard',scoringMode:'final',teamIdentifierMode:'home_away',aggregateSideA:'District A',aggregateSideB:'District B',aggregateRinks:6,gameType:'rinks',drawMethod:'auto',manualGroups:4,teamCount:16,groupSize:4,rinks:4,ends:12,start:'09:00',minutes:80,knockoutMinutes:80,targetFinish:'21:00',eventFormat:'same_day',day1TargetFinish:'21:00',day2Start:'09:00',winPts:2,drawPts:1,qualify:'winner_best_runner',bestRunners:4,optimise:'balanced'},
 pins:{admin:'0001',scorer:'0001'},teams:Array.from({length:16},(_,i)=>({id:'t'+(i+1),name:'Team '+(i+1),group:'',players:{}})),fixtures:[],knockout:[],drawSeed:1
});
let db=loadDB();let role='public', tab='dashboard';
function loadDB(){try{let x=JSON.parse(localStorage.getItem(APPKEY));if(x&&x.competitions?.length)return x}catch(e){}return {competitions:[defaultComp()],active:null}}
function canWriteCloud(){return !!currentUser&&['owner','admin','scorer'].includes(currentAppRole)}
function saveDB(){localStorage.setItem(APPKEY,JSON.stringify(db));if(cloudReady&&!cloudApplying&&remoteTournamentId&&canWriteRemoteTournament())pushRemoteTournament();}
function canWriteRemoteTournament(){let a=accessState();return !!currentUser&&a.active&&['owner','admin','scorer'].includes(remoteAccessRole)}
async function pushRemoteTournament(){
 if(remoteSaveBusy)return false;
 remoteSaveBusy=true;
 try{
  let {error}=await cloud.rpc('bowls_save_tournament',{p_id:remoteTournamentId,p_state:db,p_title:(comp().title||'')});
  if(error)throw error;
  remoteLastPushAt=Date.now();
  setTournamentNotice();
  return true
 }catch(e){
  console.error('Tournament cloud save failed',e);
  setSyncNotice('Cloud save failed • changes remain on this device',false);
  return false
 }finally{remoteSaveBusy=false}
}
function setRemoteTournament(id,code,accessRole){
 remoteTournamentId=id||'';remoteTournamentCode=(code||'').toUpperCase();remoteAccessRole=accessRole||'public';
 localStorage.setItem('bowlsRemoteTournamentId',remoteTournamentId);
 localStorage.setItem('bowlsRemoteTournamentCode',remoteTournamentCode);
 localStorage.setItem('bowlsRemoteAccessRole',remoteAccessRole);
}
function setTournamentNotice(){
 let a=accessState(),parts=['Live tournament'];
 if(remoteTournamentCode)parts.push('Code '+remoteTournamentCode);
 if(remoteAccessRole)parts.push(remoteAccessRole==='owner'?'Organiser':remoteAccessRole[0].toUpperCase()+remoteAccessRole.slice(1));
 if(currentUser&&a.label)parts.push(a.label);
 parts.push('Build '+APP_VERSION);
 setSyncNotice(parts.join(' • '),true);
}
async function createShareableTournament(){
 if(!currentUser){showAuthModal('admin');return}
 await loadCurrentProfile();let a=accessState();if(!a.active){alert('Your trial has expired.');return}
 let {data,error}=await cloud.rpc('bowls_create_tournament',{p_title:(comp().title||''),p_state:db});
 if(error){alert(error.message);return}
 let row=Array.isArray(data)?data[0]:data;if(!row){alert('Could not create tournament code.');return}
 setRemoteTournament(row.id,row.code,'owner');setTournamentNotice();alert('Tournament code: '+row.code+'\n\nShare this code with scorers and spectators.');render();
}
function startRemoteRefresh(){
 if(remoteRefreshTimer)clearInterval(remoteRefreshTimer);
 remoteRefreshTimer=setInterval(refreshRemoteTournament,2500);
}
async function openTournamentByCode(code=null){
 code=(code||prompt('Enter tournament code')||'').trim().toUpperCase();if(!code)return false;
 let {data,error}=await cloud.rpc('bowls_get_tournament_by_code',{p_code:code});
 if(error){alert(error.message);return false}
 let row=Array.isArray(data)?data[0]:data;if(!row){alert('Tournament code not found.');return false}
 let access='public';
 if(currentUser){
   let {data:j,error:je}=await cloud.rpc('bowls_request_join',{p_code:code});
   if(!je){let jr=Array.isArray(j)?j[0]:j;if(jr?.role)access=jr.role==='admin'?'owner':jr.role}
 }
 cloudApplying=true;db=row.state?.competitions?.length?row.state:db;localStorage.setItem(APPKEY,JSON.stringify(db));cloudApplying=false;
 setRemoteTournament(row.id,row.code,access);
 if(new URLSearchParams(location.search).get('join')==='scorer'&&!currentUser){
  setTimeout(()=>{if(confirm('This is a scorer invite. Sign in or create an account to request scoring access?'))showAuthModal('scorer')},300)
 }
 let inviteJoin=new URLSearchParams(location.search).get('join');
 if(inviteJoin==='scorer'&&currentUser&&access==='public'){
  let req=await cloud.rpc('bowls_request_join',{p_code:row.code});
  if(!req.error){access='pending';setRemoteTournament(row.id,row.code,access);setTimeout(()=>alert('Scorer access requested. The organiser must approve you before you can enter scores.'),250)}
 }startRemoteRefresh();role='public';tab='dashboard';setTournamentNotice();render();
 if(access==='pending')alert('Tournament opened in Public View. Your scorer access request is waiting for the organiser to approve it.');
 return true;
}

async function refreshRemoteAccess(){
 if(!cloud||!currentUser||!remoteTournamentCode)return remoteAccessRole;
 let {data,error}=await cloud.rpc('bowls_request_join',{p_code:remoteTournamentCode});
 if(error)return remoteAccessRole;
 let row=Array.isArray(data)?data[0]:data,got=row?.role;
 if(got){

function scoreAuditSnapshot(c=comp()){
 let out={};
 if(isAggregate(c)){ensureAggregate(c).forEach(r=>out[`agg:${r.rink}`]={target:`Rink ${r.rink}`,data:{scoreA:r.scoreA??'',scoreB:r.scoreB??'',liveTotalA:r.liveTotalA??'',liveTotalB:r.liveTotalB??'',liveEndsPlayed:r.liveEndsPlayed??'',liveEnds:JSON.parse(JSON.stringify(r.liveEnds||[]))}})}
 else if((c.settings.tournamentType||'standard')==='knockout'){(c.knockout||[]).flat().forEach(m=>out[`ko:${m.id}`]={target:`${m.roundName||'Knockout'} • ${m.label||''} • Rink ${m.rink||''}`,data:{scoreA:m.scoreA??'',scoreB:m.scoreB??'',liveTotalA:m.liveTotalA??'',liveTotalB:m.liveTotalB??'',liveEndsPlayed:m.liveEndsPlayed??'',liveEnds:JSON.parse(JSON.stringify(m.liveEnds||[]))}})}
 else (c.fixtures||[]).forEach(f=>out[`fixture:${f.id}`]={target:`Game ${f.game||''} • Rink ${f.rink||''}`,data:{scoreA:f.scoreA??'',scoreB:f.scoreB??'',liveTotalA:f.liveTotalA??'',liveTotalB:f.liveTotalB??'',liveEndsPlayed:f.liveEndsPlayed??'',liveEnds:JSON.parse(JSON.stringify(f.liveEnds||[]))}});
 return out
}

function scorePatchData(data){
 return {
  scoreA:data?.scoreA??'',
  scoreB:data?.scoreB??'',
  liveTotalA:data?.liveTotalA??'',
  liveTotalB:data?.liveTotalB??'',
  liveEndsPlayed:data?.liveEndsPlayed??'',
  liveEnds:Array.isArray(data?.liveEnds)?data.liveEnds:[]
 }
}
async function pushScoreDiff(before,after){
 if(!(cloudReady&&remoteTournamentId&&canWriteRemoteTournament()))return true;
 let c=comp(),ok=true;
 for(let k of Object.keys(after||{})){
  let a=before?.[k]?.data,b=after?.[k]?.data;
  if(JSON.stringify(a??null)===JSON.stringify(b??null))continue;
  let kind='',item='';
  if(k.startsWith('agg:')){kind='aggregate';item=k.slice(4)}
  else if(k.startsWith('fixture:')){kind='fixture';item=k.slice(8)}
  else if(k.startsWith('ko:')){kind='knockout';item=k.slice(3)}
  else continue;
  let {error}=await cloud.rpc('bowls_patch_score',{
   p_id:remoteTournamentId,
   p_comp_id:c.id,
   p_kind:kind,
   p_item:String(item),
   p_patch:scorePatchData(b)
  });
  if(error){console.error('Score patch failed',error);ok=false}
 }
 if(ok){remoteLastPushAt=Date.now();setTournamentNotice();setTimeout(refreshRemoteTournament,700)}
 else setSyncNotice('Score save failed online • retry before leaving this screen',false);
 return ok
}

async function auditScoreDiff(before,after){for(let k of new Set([...Object.keys(before||{}),...Object.keys(after||{})])){let a=before?.[k],b=after?.[k];if(JSON.stringify(a?.data??null)!==JSON.stringify(b?.data??null))await auditEvent('score_change',b?.target||a?.target||k,a?.data??null,b?.data??null)}}
let pendingAuditBefore=null;
async function saveScoresNow(saveForm,afterSave){
 let before=scoreAuditSnapshot();saveForm();let after=scoreAuditSnapshot();
 localStorage.setItem(APPKEY,JSON.stringify(db));
 let ok=await pushScoreDiff(before,after);
 await auditScoreDiff(before,after);
 if(ok&&afterSave)afterSave();
 else if(!ok)alert('The score did not save online. Please try again before leaving this screen.')
}

     await navigator.share({title,text:'Tournament draw',files:[file]});

function completed(f){return Number.isFinite(+f.scoreA)&&Number.isFinite(+f.scoreB)&&f.scoreA!==''&&f.scoreB!==''}
function isAggregate(c=comp()){return (c.settings.tournamentType||'standard')==='aggregate'}
function ensureAggregate(c=comp()){let x=c.settings,n=Math.max(1,+x.aggregateRinks||6);c.aggregateScores=c.aggregateScores||[];while(c.aggregateScores.length<n)c.aggregateScores.push({rink:c.aggregateScores.length+1,scoreA:'',scoreB:'',skipA:'',skipB:''});c.aggregateScores=c.aggregateScores.slice(0,n);c.aggregateScores.forEach((r,i)=>{r.rink=i+1;r.skipA=r.skipA||'';r.skipB=r.skipB||''});return c.aggregateScores}
function aggregateTotals(c=comp()){let rows=ensureAggregate(c),a=0,b=0,complete=0;rows.forEach(r=>{let s=currentScore(r);if(completed(r))complete++;a+=s.a;b+=s.b});return {a,b,complete,total:rows.length}}
function standings(c=comp()){
 let out={};c.teams.forEach(t=>out[t.group]??=[]);c.teams.forEach(t=>{if(t.group)out[t.group].push({id:t.id,name:t.name,p:0,w:0,d:0,l:0,sf:0,sa:0,sd:0,pts:0})});
 let map={};Object.values(out).flat().forEach(r=>map[r.id]=r);
 c.fixtures.filter(completed).forEach(f=>{let a=map[f.a],b=map[f.b];if(!a||!b)return;let sa=+f.scoreA,sb=+f.scoreB;a.p++;b.p++;a.sf+=sa;a.sa+=sb;b.sf+=sb;b.sa+=sa;if(sa>sb){a.w++;b.l++;a.pts+=c.settings.winPts}else if(sb>sa){b.w++;a.l++;b.pts+=c.settings.winPts}else if(sa===0&&sb===0){}else{a.d++;b.d++;a.pts+=c.settings.drawPts;b.pts+=c.settings.drawPts}});
 Object.values(out).forEach(rows=>rows.forEach(r=>r.sd=r.sf-r.sa));Object.values(out).forEach(rows=>rows.sort((a,b)=>b.pts-a.pts||b.sd-a.sd||b.sf-a.sf||a.name.localeCompare(b.name)));return out
}

function liveEntries(obj){obj.liveEnds=obj.liveEnds||[];return obj.liveEnds}
function liveScore(obj){
 if(obj.liveTotalA!==''&&obj.liveTotalA!=null&&obj.liveTotalB!==''&&obj.liveTotalB!=null){
  return {a:Math.max(0,+obj.liveTotalA||0),b:Math.max(0,+obj.liveTotalB||0),count:Math.max(0,+obj.liveEndsPlayed||0),manual:true}
 }
 let a=0,b=0,count=0;liveEntries(obj).forEach(e=>{if(e&&(e.a!==''||e.b!=='')){a+=Math.max(0,+e.a||0);b+=Math.max(0,+e.b||0);count++}});
 return {a,b,count,manual:false}
}

function currentScore(obj){
 let l=liveScore(obj),hasCheckpoint=obj.liveTotalA!==''&&obj.liveTotalA!=null&&obj.liveTotalB!==''&&obj.liveTotalB!=null;
 let hasEnds=(obj.liveEnds||[]).some(e=>e&&((e.a!==''&&e.a!=null)||(e.b!==''&&e.b!=null)));
 if(completed(obj))return {a:+obj.scoreA,b:+obj.scoreB,final:true,ends:l.count,live:false};
 return {a:l.a,b:l.b,final:false,ends:l.count,live:hasCheckpoint||hasEnds}

}

function pickFullestSession(pending,rinks,prevTeams=new Set()){
 // Primary goal: fill as many rinks as possible. Secondary goal: where equally full
 // schedules exist, prefer teams that did NOT play in the previous session.
 let best=[],bestBack=Infinity;let tries=Math.min(900,150+pending.length*10);
 for(let t=0;t<tries;t++){
  let used=new Set(),slot=[];
  let degree={};pending.forEach(z=>{degree[z.a.id]=(degree[z.a.id]||0)+1;degree[z.b.id]=(degree[z.b.id]||0)+1});
  let order=[...pending].sort((u,v)=>{
   let ub=(prevTeams.has(u.a.id)?1:0)+(prevTeams.has(u.b.id)?1:0),vb=(prevTeams.has(v.a.id)?1:0)+(prevTeams.has(v.b.id)?1:0);
   let du=degree[u.a.id]+degree[u.b.id],dv=degree[v.a.id]+degree[v.b.id];
   if(t===0)return ub-vb||dv-du||u.round-v.round;
   return (ub-vb)*4+(dv-du)*.12+(u.round-v.round)*.02+(Math.random()-.5)*3;
  });
  for(let z of order){if(slot.length>=rinks)break;if(!used.has(z.a.id)&&!used.has(z.b.id)){slot.push(z);used.add(z.a.id);used.add(z.b.id)}}
  let back=slot.reduce((n,z)=>n+(prevTeams.has(z.a.id)?1:0)+(prevTeams.has(z.b.id)?1:0),0);
  if(slot.length>best.length||(slot.length===best.length&&back<bestBack)){best=slot;bestBack=back}
  if(best.length===rinks&&bestBack===0)break;
 }
 return best.length?best:[pending[0]];
}
function sessionTeams(slot){return new Set(slot.flatMap(z=>[z.a.id,z.b.id]))}
function sessionBalanceScore(slots,rinks){
 let live=slots.filter(x=>x.length),btb=backToBackStats(live).count,loads=live.map(x=>x.length),avg=loads.length?loads.reduce((a,b)=>a+b,0)/loads.length:0;
 let spread=loads.reduce((n,x)=>n+Math.pow(x-avg,2),0),thin=loads.length?Math.max(0,rinks-loads[loads.length-1]):0;

function rebalanceSessions(slots,rinks){
 let work=slots.map(x=>[...x]),guard=0;
 while(guard++<250){
  let base=sessionBalanceScore(work,rinks),best=null,bestScore=base;
  for(let si=0;si<work.length;si++){
   for(let gi=0;gi<work[si].length;gi++){
    let game=work[si][gi],ids=new Set([game.a.id,game.b.id]);
    for(let di=0;di<work.length;di++){
     if(di===si||work[di].length>=rinks)continue;
     let destTeams=sessionTeams(work[di]);if([...ids].some(id=>destTeams.has(id)))continue;
     let trial=work.map(x=>[...x]);trial[si].splice(gi,1);trial[di].push(game);trial=trial.filter(x=>x.length);
     let score=sessionBalanceScore(trial,rinks);
     if(score<bestScore){best={si,gi,di};bestScore=score}
    }
   }
  }
  if(!best)break;
  let game=work[best.si].splice(best.gi,1)[0],destIndex=best.di;
  if(!work[best.si].length&&best.si<destIndex)destIndex--;
  work=work.filter(x=>x.length);work[destIndex].push(game);

}
function scheduleGames(all,rinks){

 let remainingWinners=winners.filter(w=>!used.has(w.id));
 // Prefer winner v qualifier from another group.
 remainingWinners.forEach(w=>{let pool=others.filter(o=>!used.has(o.id)),opp=pool.find(o=>o.group!==w.group)||pool[0];if(opp){matches.push({a:w.id,b:opp.id,scoreA:'',scoreB:'',sameGroupRematch:opp.group===w.group,groupA:w.group,groupB:opp.group});used.add(w.id);used.add(opp.id)}});
 let left=ranked.filter(x=>!used.has(x.id));
 // Pair remaining qualifiers, again avoiding same-group meetings wherever possible.
 while(left.length>1){let a=left.shift(),idx=left.findIndex(b=>b.group!==a.group);if(idx<0)idx=0;let b=left.splice(idx,1)[0];matches.push({a:a.id,b:b.id,scoreA:'',scoreB:'',sameGroupRematch:a.group===b.group,groupA:a.group,groupB:b.group});used.add(a.id);used.add(b.id)}
 if(left.length){let a=left.shift();matches.push({a:a.id,b:null,scoreA:'',scoreB:'',sameGroupRematch:false,groupA:a.group,groupB:null})}
 while(matches.length<size/2)matches.push({a:null,b:null,scoreA:'',scoreB:'',sameGroupRematch:false,groupA:null,groupB:null});
 return matches;
}

function tvCurrentGames(c){
 let fs=c.fixtures||[];
 if(!fs.length)return[];
 let live=fs.filter(f=>!completed(f)&&currentScore(f).live);
 if(live.length)return live;
 let pending=fs.filter(f=>!completed(f));
 let currentSession=pending.length?Math.min(...pending.map(f=>f.session)):Math.max(...fs.map(f=>f.session));
 return fs.filter(f=>f.session===currentSession)
}
function tvUpcoming(c){
 let fs=c.fixtures||[],pending=fs.filter(f=>!completed(f));
 if(!pending.length)return[];
 let sessions=[...new Set(pending.map(f=>f.session))].sort((a,b)=>a-b);
 let current=sessions[0],next=sessions.find(s=>s>current);
 let target=next??current;
 return pending.filter(f=>f.session===target).slice(0,16)
}

function aggregateEndsProgress(c){
 let x=c.settings,rows=ensureAggregate(c),perRink=Math.max(0,+x.ends||0),total=perRink*rows.length,played=0;
 rows.forEach(r=>{
  if(completed(r)){played+=perRink;return}
  let cs=currentScore(r);
  if(cs.live){
   let e=Math.max(0,Math.min(perRink,+cs.ends||0));
   played+=e
  }
 });
 played=Math.min(total,played);
 return {total,played,remaining:Math.max(0,total-played),perRink,rinks:rows.length}
}
