<style>

*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#082f49,#075985);color:#fff;padding:14px 14px 10px;box-shadow:0 2px 12px #0002}.brand{display:flex;align-items:center;gap:10px}.ball{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#dbeafe 18%,#1e3a8a 20%,#082f49 72%);border:2px solid #fff8;box-shadow:inset -4px -5px 10px #0005}.brand h1{font-size:18px;margin:0}.brand small{display:block;color:#bae6fd;margin-top:2px}.rolebar{display:flex;gap:7px;margin-top:12px;overflow:auto;padding-bottom:2px}.rolebar button{white-space:nowrap;background:#ffffff18;border:1px solid #ffffff35;color:white;padding:8px 11px;border-radius:999px}.rolebar button.active{background:#fff;color:var(--nav);font-weight:700}
.wrap{max-width:1100px;margin:0 auto;padding:14px 14px 90px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar select,.toolbar input{background:#fff;border:1px solid var(--line);padding:9px 10px;border-radius:10px}.grow{flex:1}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#e2e8f0;color:#0f172a}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px;box-shadow:0 3px 12px #0f172a08}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow:auto;padding:2px 0 10px}.tabs button{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px;white-space:nowrap}.tabs button.active{background:var(--nav);color:#fff;border-color:var(--nav)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:650px;background:#fff}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{background:#f1f5f9;font-size:12px;text-transform:uppercase;letter-spacing:.03em}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.pill.done{background:#dcfce7;color:#166534}.pill.wait{background:#fef3c7;color:#92400e}.scoreline{display:grid;grid-template-columns:1fr 58px 22px 58px 1fr;gap:7px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.scoreline:last-child{border-bottom:0}.scoreline input{width:58px;text-align:center;padding:10px 5px;border:1px solid #cbd5e1;border-radius:9px;font-size:18px;font-weight:800}.scoreline .away{text-align:right}.meta{font-size:12px;color:var(--muted);margin-top:3px}.groupgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.groupbox h3{background:var(--nav);color:#fff;padding:9px 11px;border-radius:10px 10px 0 0;margin:0}.groupbox .tablewrap{border-radius:0 0 10px 10px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:700}.field input,.field select{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px;background:#fff}.teamrow{display:flex;gap:8px;margin-bottom:7px}.teamrow span{width:34px;color:var(--muted);padding-top:10px}.teamrow input{flex:1;border:1px solid #cbd5e1;border-radius:9px;padding:9px}.notice{padding:10px 12px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;margin-bottom:12px}.oknotice{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}.hidden{display:none!important}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:none;z-index:20;padding-bottom:env(safe-area-inset-bottom)}.bottom button{flex:1;border:0;background:#fff;padding:10px 4px;font-size:11px;color:#475569}.bottom button.active{color:var(--blue);font-weight:800}.bottom b{display:block;font-size:18px;margin-bottom:2px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}.modalbox{background:#fff;border-radius:16px;padding:18px;width:min(390px,100%)}.modalbox input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:22px;text-align:center;letter-spacing:5px;margin:8px 0 12px}.bracket{display:grid;grid-template-columns:repeat(3,minmax(210px,1fr));gap:16px;overflow:auto}.round{min-width:210px}.match{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff;overflow:hidden}.match div{padding:8px 10px;border-bottom:1px solid var(--line)}.match div:last-child{border-bottom:0}.qual{font-size:12px;color:var(--muted)}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.groupgrid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr 1fr}.bottom{display:flex}.wrap{padding-bottom:86px}.desktopOnly{display:none}.scoreline{grid-template-columns:1fr 50px 16px 50px 1fr}.scoreline input{width:50px}.toolbar{align-items:stretch}.toolbar .grow{flex-basis:100%}}
@media(max-width:440px){.formgrid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}

.scorecards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.scorecard{background:#fff;border:2px solid #0f172a;border-radius:8px;padding:8px;break-inside:avoid;min-height:250px}.scHead{display:flex;justify-content:space-between;border-bottom:2px solid #0f172a;padding-bottom:5px;font-size:13px}.scMeta{text-align:center;font-size:11px;padding:5px 0}.scTeams{display:grid;grid-template-columns:1fr 20px 1fr;align-items:center;text-align:center;font-size:13px;border:1px solid #94a3b8;padding:5px}.ends{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:6px}.endcell{border:1px solid #94a3b8;min-height:30px;text-align:center;font-size:9px}.endcell b{display:block;background:#f1f5f9}.totals{display:flex;justify-content:space-between;font-weight:800;margin-top:6px}.sig{font-size:9px;margin-top:9px}.noPrint{}
@media print{header,.toolbar,.tabs,.bottom,.noPrint,#syncNotice{display:none!important}.wrap{max-width:none;padding:0}.scorecards-grid{display:grid!important;gap:4mm}.scorecards-grid.cards-8{grid-template-columns:repeat(4,1fr)}.scorecards-grid.cards-6{grid-template-columns:repeat(3,1fr)}.scorecards-grid.cards-4{grid-template-columns:repeat(2,1fr)}.scorecard{border-radius:0;min-height:0;height:90mm;font-size:10px}.cards-6 .scorecard{height:94mm}.cards-4 .scorecard{height:135mm}@page{size:A3 landscape;margin:8mm}}

<body>
<header class="top">
  <div class="brand"><div class="ball"></div><div><h1>One Stop Bowling Software</h1><small id="subtitle">Live tournament management</small></div></div>
  <div class="rolebar"><button data-role="public" class="active">Public View</button><button data-role="scorer">Scorer</button><button data-role="admin">Admin</button></div>
</header>
<main class="wrap">
  <div class="notice" id="syncNotice">Offline mode: tournaments and scores are saved on this device. Use Backup regularly to save a copy you can restore on another device.</div>
  <div class="toolbar">
    <select id="competitionSelect" class="grow"></select>
    <button class="btn secondary" id="exportBtn">Backup</button>
    <label class="btn secondary" style="cursor:pointer">Restore<input id="importFile" type="file" accept="application/json" hidden></label>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <section id="screen"></section>
</main>
<nav class="bottom" id="bottomNav"></nav>
<div class="modal hidden" id="pinModal"><div class="modalbox"><h3 id="pinTitle">Enter PIN</h3><p class="muted" id="pinText"></p><input id="pinInput" inputmode="numeric" maxlength="8" type="password"><div style="display:flex;gap:8px"><button class="btn secondary" style="flex:1" id="pinCancel">Cancel</button><button class="btn primary" style="flex:1" id="pinGo">Unlock</button></div><p id="pinError" style="color:#b91c1c"></p></div></div>
<script>
const APPKEY='bowlsTournamentProOfflineV2';
const defaultComp=()=>({
 id:'comp-'+Date.now(),title:'Bowls Competition',created:new Date().toISOString(),
 settings:{teamCount:16,groupSize:4,rinks:4,ends:12,start:'09:00',minutes:80,knockoutMinutes:80,targetFinish:'21:00',winPts:2,drawPts:1,qualify:'winner_best_runner',bestRunners:4,optimise:'balanced'},
 pins:{admin:'0001',scorer:'0001'},teams:Array.from({length:16},(_,i)=>({id:'t'+(i+1),name:'Team '+(i+1),group:''})),fixtures:[],knockout:[],drawSeed:1
});
let db=loadDB();let role='public', unlocked={public:true,scorer:false,admin:false}, tab='dashboard';
function loadDB(){try{let x=JSON.parse(localStorage.getItem(APPKEY));if(x&&x.competitions?.length)return x}catch(e){}return {competitions:[defaultComp()],active:null}}
function saveDB(){localStorage.setItem(APPKEY,JSON.stringify(db));}
function comp(){if(!db.active)db.active=db.competitions[0].id;return db.competitions.find(c=>c.id===db.active)||db.competitions[0]}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function tabsFor(){if(role==='public')return [['dashboard','Home','⌂'],['tables','Tables','▤'],['fixtures','Fixtures','▦'],['knockout','Finals','🏆']];if(role==='scorer')return [['quick','Quick Score','⚡'],['fixtures','Fixtures','▦'],['tables','Tables','▤']];return [['dashboard','Dashboard','⌂'],['builder','Setup','⚙'],['teams','Teams','👥'],['draw','Draw','🎲'],['schedule','Rinks','▦'],['quick','Scores','⚡'],['tables','Tables','▤'],['scorecards','Scorecards','🖨'],['knockout','Knockout','🏆'],['admin','Admin','🔐']]}
function renderNav(){let tabs=tabsFor(); if(!tabs.some(x=>x[0]===tab))tab=tabs[0][0];document.getElementById('tabs').innerHTML=tabs.map(x=>`<button class="${tab===x[0]?'active':''}" data-tab="${x[0]}">${x[1]}</button>`).join('');document.getElementById('bottomNav').innerHTML=tabs.slice(0,5).map(x=>`<button class="${tab===x[0]?'active':''}" data-tab="${x[0]}"><b>${x[2]}</b>${x[1]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function renderSelect(){let s=document.getElementById('competitionSelect');s.innerHTML=db.competitions.map(c=>`<option value="${c.id}" ${c.id===comp().id?'selected':''}>${esc(c.title)}</option>`).join('');s.onchange=()=>{db.active=s.value;saveDB();render()}}
function render(){renderSelect();renderNav();document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role));document.getElementById('subtitle').textContent=comp().title+' • '+role[0].toUpperCase()+role.slice(1);let s=document.getElementById('screen');({dashboard:renderDashboard,builder:renderBuilder,teams:renderTeams,draw:renderDraw,schedule:renderSchedule,fixtures:renderFixtures,quick:renderQuick,tables:renderTables,scorecards:renderScorecards,knockout:renderKnockout,admin:renderAdmin}[tab]||renderDashboard)(s)}
function completed(f){return Number.isFinite(+f.scoreA)&&Number.isFinite(+f.scoreB)&&f.scoreA!==''&&f.scoreB!==''}
function standings(c=comp()){
 let out={};c.teams.forEach(t=>out[t.group]??=[]);c.teams.forEach(t=>{if(t.group)out[t.group].push({id:t.id,name:t.name,p:0,w:0,d:0,l:0,sf:0,sa:0,sd:0,pts:0})});
 let map={};Object.values(out).flat().forEach(r=>map[r.id]=r);
 c.fixtures.filter(completed).forEach(f=>{let a=map[f.a],b=map[f.b];if(!a||!b)return;let sa=+f.scoreA,sb=+f.scoreB;a.p++;b.p++;a.sf+=sa;a.sa+=sb;b.sf+=sb;b.sa+=sa;if(sa>sb){a.w++;b.l++;a.pts+=c.settings.winPts}else if(sb>sa){b.w++;a.l++;b.pts+=c.settings.winPts}else if(sa===0&&sb===0){}else{a.d++;b.d++;a.pts+=c.settings.drawPts;b.pts+=c.settings.drawPts}});
 Object.values(out).forEach(rows=>rows.forEach(r=>r.sd=r.sf-r.sa));Object.values(out).forEach(rows=>rows.sort((a,b)=>b.pts-a.pts||b.sd-a.sd||b.sf-a.sf||a.name.localeCompare(b.name)));return out
}
function renderDashboard(s){let c=comp(),done=c.fixtures.filter(completed).length,total=c.fixtures.length,st=standings(c),leaders=Object.entries(st).map(([g,r])=>r[0]&&`Group ${g}: ${r[0].name}`).filter(Boolean);s.innerHTML=`<div class="grid"><div class="kpi"><b>${c.teams.length}</b><span>Teams</span></div><div class="kpi"><b>${new Set(c.teams.map(t=>t.group).filter(Boolean)).size}</b><span>Groups</span></div><div class="kpi"><b>${c.settings.rinks}</b><span>Rinks</span></div><div class="kpi"><b>${done}/${total}</b><span>Games complete</span></div></div><div class="card"><h2>${esc(c.title)}</h2><p class="muted">${c.settings.ends} ends • ${c.settings.minutes} min games • starts ${c.settings.start}</p>${total?`<div style="height:10px;background:#e2e8f0;border-radius:9px;overflow:hidden"><div style="height:100%;width:${Math.round(done/total*100)}%;background:#0284c7"></div></div><p><b>${total?Math.round(done/total*100):0}% complete</b></p>`:`<p>No fixtures yet. ${role==='admin'?'Open Tournament Builder and generate the draw.':'The organiser has not generated fixtures yet.'}</p>`}</div><div class="card"><h3>Group Leaders</h3>${leaders.length?leaders.map(x=>`<div style="padding:7px 0;border-bottom:1px solid var(--line)">${esc(x)}</div>`).join(''):'<p class="muted">Standings will appear once the draw is generated.</p>'}</div>`}
function renderBuilder(s){let c=comp(),x=c.settings;s.innerHTML=`<div class="card"><h2>Tournament Builder</h2><p class="muted">Plan the competition before generating the draw.</p><div class="formgrid">
${field('Competition title','title',c.title,'text')}${field('Number of teams','teamCount',x.teamCount,'number',3,80)}${field('Preferred teams/group','groupSize',x.groupSize,'number',3,8)}${field('Rinks available','rinks',x.rinks,'number',1,20)}${field('Ends per game','ends',x.ends,'number',1,30)}${field('Start time','start',x.start,'time')}${field('Minutes per group game','minutes',x.minutes,'number',10,240)}${field('Minutes per knockout game','knockoutMinutes',x.knockoutMinutes||x.minutes,'number',10,240)}${field('Target finish time','targetFinish',x.targetFinish||'21:00','time')}${field('Win points','winPts',x.winPts,'number',0,10)}${field('Draw points','drawPts',x.drawPts,'number',0,10)}
<div class="field"><label>Optimise for</label><select id="optimise"><option value="balanced" ${(x.optimise||'balanced')==='balanced'?'selected':''}>Balanced</option><option value="shortest" ${x.optimise==='shortest'?'selected':''}>Shortest Day</option><option value="games" ${x.optimise==='games'?'selected':''}>Most Games</option></select></div>
<div class="field"><label>Qualification</label><select id="qualify"><option value="winners" ${x.qualify==='winners'?'selected':''}>Group winners</option><option value="top2" ${x.qualify==='top2'?'selected':''}>Top 2 each group</option><option value="winner_best_runner" ${x.qualify==='winner_best_runner'?'selected':''}>Winners + best runners-up</option></select></div>${field('Best runners-up','bestRunners',x.bestRunners,'number',0,32)}</div>
<div id="planPreview" style="margin-top:14px"></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn secondary" id="saveSetup">Save Setup</button><button class="btn primary" id="generateDraw">Generate / Redraw Groups</button><button class="btn success" id="generateFixtures">Generate Rinks & Times</button></div></div>`;
 function updatePlan(){
  let n=Math.max(3,+document.getElementById('teamCount').value||3),gs=Math.max(3,+document.getElementById('groupSize').value||4),r=Math.max(1,+document.getElementById('rinks').value||1),m=Math.max(10,+document.getElementById('minutes').value||80),km=Math.max(10,+document.getElementById('knockoutMinutes').value||m),st=document.getElementById('start').value||'09:00',target=document.getElementById('targetFinish').value||'21:00',mode=document.getElementById('optimise').value||'balanced',qualify=document.getElementById('qualify').value,best=Math.max(0,+document.getElementById('bestRunners').value||0),p=fullDayPlan(n,gs,r,m,km,st,target,qualify,best),sg=suggestedGroup(n,r,m,km,st,target,qualify,best,mode),same=sg.g===gs,alts=groupOptions(n,r,m,km,st,target,qualify,best,mode).filter(z=>z.g!==sg.g).slice(0,2);
  let status=p.onTime?`<span style="color:var(--green);font-weight:800">✅ Expected to finish by ${target}</span>`:`<span style="color:var(--red);font-weight:800">⚠️ Estimated ${p.overBy} min after ${target}</span>`;
  let warn='';if(!same){if(!p.onTime&&sg.p.onTime)warn=`<div class="warn notice" style="margin-top:10px">⚠️ Your current format is forecast to miss the ${target} target. The recommended group size is forecast to finish at ${sg.p.finalFinish}.</div>`;else if(p.totalSessions>sg.p.totalSessions)warn=`<div class="warn notice" style="margin-top:10px">⚠️ Your current group size takes ${p.totalSessions-sg.p.totalSessions} extra session${p.totalSessions-sg.p.totalSessions===1?'':'s'} across the full tournament.</div>`}
  document.getElementById('planPreview').innerHTML=`<div class="oknotice notice"><b>Full-day forecast</b><br>${p.sizes.length} groups (${p.sizes.join(' / ')} teams) • ${p.groupGames} group games • ${p.groupSessions} group sessions<br>Group stage finish: <b>${p.groupFinish}</b> • ${p.qualifiers} qualifier${p.qualifiers===1?'':'s'} • knockout bracket ${p.bracketSize}<br>${p.koRounds.map(x=>`${x.name}: ${x.matches} game${x.matches===1?'':'s'} / ${x.sessions} session${x.sessions===1?'':'s'}`).join(' • ')}<br><b>Estimated final finish: ${p.finalFinish}</b> • ${status}<br>Total tournament sessions: ${p.totalSessions} • Group rink use: ${p.util}% • Back-to-back team games: <b>${p.backToBack}</b><hr style="border:0;border-top:1px solid rgba(15,23,42,.12);margin:12px 0"><b>Best option for ${mode==='shortest'?'Shortest Day':mode==='games'?'Most Games':'Balanced'}: groups of ${sg.g}</b><br>${sg.p.sizes.length} groups (${sg.p.sizes.join(' / ')}) • ${sg.p.groupGames} group games • ${sg.p.qualifiers} qualifiers • final <b>${sg.p.finalFinish}</b> ${sg.p.onTime?'✅':'⚠️'} • ${sg.p.util}% group rink use • ${sg.p.backToBack} back-to-back${same?' • you are already using this option':` <button class="btn secondary" id="useSuggested" style="padding:5px 9px;margin-left:6px">Use ${sg.g}</button>`}${alts.length?`<div style="margin-top:10px"><b>Alternatives:</b> ${alts.map(a=>`groups of ${a.g}: ${a.p.groupGames} group games, ${a.p.qualifiers} qualifiers, final ${a.p.finalFinish} ${a.p.onTime?'✅':'⚠️'}`).join(' • ')}</div>`:''}</div>${warn}`;
  let b=document.getElementById('useSuggested');if(b)b.onclick=()=>{document.getElementById('groupSize').value=sg.g;updatePlan()}
 }
 ['teamCount','groupSize','rinks','minutes','knockoutMinutes','start','targetFinish','optimise','qualify','bestRunners'].forEach(id=>document.getElementById(id).addEventListener('input',updatePlan));updatePlan();
 document.getElementById('saveSetup').onclick=()=>saveSettings(false);document.getElementById('generateDraw').onclick=()=>{saveSettings(false);generateDraw();tab='draw';render()};document.getElementById('generateFixtures').onclick=()=>{saveSettings(false);if(!comp().teams.some(t=>t.group))generateDraw();generateFixtures();tab='schedule';render()}}
function field(label,id,val,type='text',min='',max=''){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(val)}" ${min!==''?`min="${min}"`:''} ${max!==''?`max="${max}"`:''}></div>`}
function saveSettings(rerender=true){let c=comp(),x=c.settings;c.title=document.getElementById('title').value.trim()||'Bowls Competition';['teamCount','groupSize','rinks','ends','minutes','knockoutMinutes','winPts','drawPts','bestRunners'].forEach(k=>x[k]=+document.getElementById(k).value);x.start=document.getElementById('start').value;x.targetFinish=document.getElementById('targetFinish').value;x.qualify=document.getElementById('qualify').value;x.optimise=document.getElementById('optimise').value;while(c.teams.length<x.teamCount)c.teams.push({id:'t'+(Date.now()+c.teams.length),name:'Team '+(c.teams.length+1),group:''});c.teams=c.teams.slice(0,x.teamCount);saveDB();if(rerender)render()}
function shuffle(a,seed){let arr=[...a],x=seed||Date.now();for(let i=arr.length-1;i>0;i--){x=(x*9301+49297)%233280;let j=Math.floor((x/233280)*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function generateDraw(){
 let c=comp(),x=c.settings;c.drawSeed=Date.now()%1000000;let arr=shuffle(c.teams,c.drawSeed),groups=Math.ceil(arr.length/x.groupSize);
 // balanced allocation: difference between largest and smallest group is never more than one
 arr.forEach((t,i)=>t.group=String.fromCharCode(65+(i%groups)));
 c.fixtures=[];c.knockout=[];saveDB();
}
function pickFullestSession(pending,rinks,prevTeams=new Set()){
 // Primary goal: fill as many rinks as possible. Secondary goal: where equally full
 // schedules exist, prefer teams that did NOT play in the previous session.
 let best=[],bestBack=Infinity;let tries=Math.min(900,150+pending.length*10);
 for(let t=0;t<tries;t++){
  let used=new Set(),slot=[];
  let degree={};pending.forEach(z=>{degree[z.a.id]=(degree[z.a.id]||0)+1;degree[z.b.id]=(degree[z.b.id]||0)+1});
  let order=[...pending].sort((u,v)=>{
   let ub=(prevTeams.has(u.a.id)?1:0)+(prevTeams.has(u.b.id)?1:0),vb=(prevTeams.has(v.a.id)?1:0)+(prevTeams.has(v.b.id)?1:0);
   let du=degree[u.a.id]+degree[u.b.id],dv=degree[v.a.id]+degree[v.b.id];
   if(t===0)return ub-vb||dv-du||u.round-v.round;

  });

function renderKnockout(s){let c=comp(),q=qualifiers();s.innerHTML=`<div class="card"><h2>Knockout</h2><p class="muted">Qualifiers are ranked by points, shot difference and shots for.</p><div>${q.map((x,i)=>`<span class="pill wait" style="margin:3px">${i+1}. ${esc(x.name)} <span class="qual">(${x.group}${x.pos})</span></span>`).join('')||'No qualifiers yet.'}</div>${role==='admin'?`<button class="btn primary" id="genKO" style="margin-top:12px">Generate Knockout</button>`:''}</div>${c.knockout.length?`<div class="card"><div class="bracket">${c.knockout.map((round,ri)=>`<div class="round"><h3>${ri===c.knockout.length-1&&round.length===1?'Final':ri===0?'First Round':'Round '+(ri+1)}</h3>${round.map((m,mi)=>`<div class="match"><div>${esc(m.a?teamName(m.a):'BYE')}</div><div>${esc(m.b?teamName(m.b):'BYE')}</div></div>`).join('')}</div>`).join('')}</div></div>`:''}`;if(role==='admin'&&document.getElementById('genKO'))document.getElementById('genKO').onclick=generateKnockout}
function renderAdmin(s){let c=comp();s.innerHTML=`<div class="card"><h2>Access & Competition Admin</h2><div class="formgrid"><div class="field"><label>Admin PIN</label><input id="adminPin" type="password" value="${esc(c.pins.admin)}"></div><div class="field"><label>Scorer PIN</label><input id="scorerPin" type="password" value="${esc(c.pins.scorer)}"></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" id="savePins">Save PINs</button><button class="btn secondary" id="newComp">New Competition</button><button class="btn danger" id="resetComp">Reset Current Competition</button></div></div><div class="card"><h3>Easy-link plan</h3><p><b>Public:</b> <span class="muted">/ ?view=public</span><br><b>Scorer:</b> <span class="muted">/ ?view=scorer</span><br><b>Admin:</b> <span class="muted">/ ?view=admin</span></p><p class="muted">Once hosted, these can be pointed to three TinyURLs and QR codes.</p></div>`;document.getElementById('savePins').onclick=()=>{c.pins.admin=document.getElementById('adminPin').value||'0001';c.pins.scorer=document.getElementById('scorerPin').value||'0001';saveDB();alert('PINs saved')};document.getElementById('newComp').onclick=()=>{let n=defaultComp();n.title='New Competition';db.competitions.push(n);db.active=n.id;saveDB();tab='builder';render()};document.getElementById('resetComp').onclick=()=>{if(confirm('Reset this competition? Scores, draw and fixtures will be cleared.')){c.fixtures=[];c.knockout=[];c.teams.forEach((t,i)=>{t.group='';t.name='Team '+(i+1)});saveDB();render()}}}
function askPin(nextRole){let c=comp();document.getElementById('pinTitle').textContent=nextRole==='admin'?'Admin PIN':'Scorer PIN';document.getElementById('pinText').textContent='Enter the PIN for '+c.title;document.getElementById('pinInput').value='';document.getElementById('pinError').textContent='';document.getElementById('pinModal').classList.remove('hidden');document.getElementById('pinInput').focus();document.getElementById('pinGo').onclick=()=>{if(document.getElementById('pinInput').value===c.pins[nextRole]){unlocked[nextRole]=true;role=nextRole;document.getElementById('pinModal').classList.add('hidden');tab=nextRole==='scorer'?'quick':'dashboard';setQueryRole(nextRole);render()}else document.getElementById('pinError').textContent='Incorrect PIN'}}
function setQueryRole(r){try{let u=new URL(location.href);u.searchParams.set('view',r);history.replaceState({},'',u)}catch(e){}}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{let r=b.dataset.role;if(r==='public'||unlocked[r]){role=r;tab='dashboard';setQueryRole(r);render()}else askPin(r)});document.getElementById('pinCancel').onclick=()=>document.getElementById('pinModal').classList.add('hidden');document.getElementById('pinInput').onkeydown=e=>{if(e.key==='Enter')document.getElementById('pinGo').click()};
document.getElementById('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bowls-tournament-backup.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.competitions)throw 0;db=x;saveDB();render()}catch{alert('That backup file could not be read.')}};r.readAsText(f)};
let initial=new URLSearchParams(location.search).get('view');if(initial==='scorer'||initial==='admin')setTimeout(()=>askPin(initial),100);render();
</script>
</body></html>
